services:
  postgres:
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: botsales_admin
      POSTGRES_DB: botsales_be_dev
      POSTGRES_PASSWORD: ${BOTSALES_DB_ADMIN_PASSWORD:?Set BOTSALES_DB_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      BOTSALES_DB_MIGRATION_PASSWORD: ${BOTSALES_DB_MIGRATION_PASSWORD:?Set BOTSALES_DB_MIGRATION_PASSWORD}
      BOTSALES_DB_RUNTIME_PASSWORD: ${BOTSALES_DB_RUNTIME_PASSWORD:?Set BOTSALES_DB_RUNTIME_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/10-botsales.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=botsales_admin", "--dbname=botsales_be_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.0.5@sha256:dbd4be0dd40f16bd91486087680fc2d25666e807b937774906dc111a621ce556
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
