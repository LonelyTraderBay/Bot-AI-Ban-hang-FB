'use strict';
globalThis.BSDemo = globalThis.BSDemo || {};
BSDemo.domain = (()=>{
  const money = value => {if(!/^\d+$/.test(String(value)))throw new Error('Số tiền phải là số nguyên VND không âm.');const n=BigInt(value);if(n>1000000000000n)throw new Error('Số tiền vượt giới hạn của demo.');return n;};
  const quantity = value => {const n=Number(value);if(!Number.isSafeInteger(n)||n<1||n>10000)throw new Error('Số lượng phải là số nguyên từ 1 đến 10.000.');return n;};
  const total=o=>o.lines.reduce((s,l)=>s+money(l.unitPrice)*BigInt(l.quantity),0n);
  const cost=o=>o.lines.reduce((s,l)=>s+money(l.unitCost)*BigInt(l.quantity),0n);
  const available=p=>p.onHand-p.reserved;
  const tally=s=>{
    const sold=s.orders.filter(o=>o.fulfillment==='fulfilled'&&o.state!=='returned');
    const revenue=sold.reduce((a,o)=>a+total(o),0n),cogs=sold.reduce((a,o)=>a+cost(o),0n);
    const receipts=s.orders.filter(o=>o.payment==='paid').reduce((a,o)=>a+total(o),0n);
    const disbursements=s.expenses.reduce((a,e)=>a+money(e.amount),0n);
    const operating=s.expenses.filter(e=>e.type==='operating').reduce((a,e)=>a+money(e.amount),0n);
    return {revenue,cogs,gross:revenue-cogs,operating,profit:revenue-cogs-operating,receipts,disbursements,cash:receipts-disbursements};
  };
  function command(s,id,action){
    const o=s.orders.find(x=>x.id===id);if(!o)throw new Error('Không tìm thấy đơn trong shop này.');
    const entries=o.lines.map(l=>({l,p:s.products.find(p=>p.id===l.productId)}));
    if(entries.some(x=>!x.p))throw new Error('Sản phẩm không còn trong bộ dữ liệu.');
    if(action==='confirm'){
      if(o.state!=='draft')throw new Error('Chỉ xác nhận đơn nháp.');
      for(const {l,p} of entries){if(!p.active)throw new Error(p.name+' đã ngừng bán.');if(available(p)<l.quantity)throw new Error(p.name+': chỉ còn '+available(p)+' sản phẩm khả dụng.');if(l.unitPrice!==p.price)throw new Error('Giá đã thay đổi. Hãy tạo lại đơn nháp với giá mới.');}
      entries.forEach(({l,p})=>p.reserved+=l.quantity);o.state='confirmed';
    }else if(action==='dispatch'){
      if(o.state!=='confirmed'||o.fulfillment!=='unfulfilled')throw new Error('Đơn chưa xác nhận hoặc đã xuất kho.');
      for(const {l,p}of entries)if(p.reserved<l.quantity||p.onHand<l.quantity)throw new Error('Tồn kho không đủ.');
      entries.forEach(({l,p})=>{p.onHand-=l.quantity;p.reserved-=l.quantity;s.movements.unshift({id:'mv-'+id+'-'+p.id,productId:p.id,change:-l.quantity,reason:'Xuất kho '+id,date:'2026-09-29'});});o.fulfillment='dispatched';
    }else if(action==='pay'){
      if(!['confirmed','completed'].includes(o.state)||o.payment==='paid')throw new Error('Chỉ thu tiền một lần cho đơn đã xác nhận.');
      o.payment='paid';if(o.fulfillment==='fulfilled')o.state='completed';
    }else if(action==='cancel'){
      if(!['draft','confirmed'].includes(o.state)||['dispatched','fulfilled'].includes(o.fulfillment)||o.payment==='paid')throw new Error('Chỉ hủy đơn chưa xuất kho và chưa thanh toán.');
      if(o.state==='confirmed')entries.forEach(({l,p})=>p.reserved-=l.quantity);o.state='cancelled';
    }else if(action==='return'){
      throw new Error('Mở Yêu cầu đổi trả V2; không tự hoàn tiền hoặc cộng hàng chưa kiểm.');
      entries.forEach(({l,p})=>{p.onHand+=l.quantity;s.movements.unshift({id:'ret-'+id+'-'+p.id,productId:p.id,change:l.quantity,reason:'Hoàn toàn bộ '+id,date:'2026-09-29'});});o.state='returned';o.payment='refunded';o.fulfillment='returned';
    }else throw new Error('Thao tác không được hỗ trợ.');
    o.version++;return o;
  }
  function addProduct(s,data,id){
    const name=String(data.name||'').trim(),sku=String(data.sku||'').trim().toUpperCase();
    if(!name||name.length>120)throw new Error('Tên sản phẩm cần 1–120 ký tự.');
    if(!/^[A-Z0-9_-]{2,32}$/.test(sku))throw new Error('SKU gồm 2–32 ký tự chữ, số, dấu - hoặc _.');
    if(s.products.some(p=>p.sku===sku&&p.id!==id))throw new Error('SKU đã tồn tại trong shop này.');
    money(data.price);money(data.cost);
    return {id,sku,name,category:data.category||'Khác',variant:String(data.variant||'Tiêu chuẩn').slice(0,60),price:String(data.price),cost:String(data.cost),onHand:0,reserved:0,threshold:3,icon:'shirt',active:true,description:String(data.description||'').slice(0,2000),version:1};
  }
  return {money,quantity,total,cost,available,tally,command,addProduct};
})();

 function journal(s,ref,label,debits,credits){const v=init(s);if(v.journals.some(j=>j.ref===ref))return;check(sum(debits)===sum(credits),'Bút toán không cân bằng.');v.journals.unshift({id:'JE-'+(++v.seq),ref,label,debits,credits,date:'2026-09-29'});}

function shell(content){return `<a class="skip" href="#main-content">Đến nội dung</a><div class="layout"><aside class="sidebar ${ui.mobile?'open':''}" aria-label="Điều hướng chính"><a href="#/overview" class="brand"><div class="brand-mark">B</div><div class="brand-name">BotSales<span>AI</span></div></a><button class="shop-switch" data-action="switch-shop"><div class="shop-symbol">${I('warehouse')}</div><div><strong class="small">${h(s().name)}</strong><div class="subtle">Không gian mô phỏng</div></div>${I('down')}</button><nav class="nav-scroll">${nav()}</nav><div class="side-foot">${link('review','Góp ý & danh sách cần duyệt','edit','nav-link '+(ui.page==='review'?'active':''))}<div class="profile"><div class="avatar">JT</div><div class="grow"><strong class="small">Jokertrader</strong><div class="subtle">${h(roleNames[state.role])} · demo</div></div>${iconBtn('demo-options','Tùy chọn thử nghiệm','settings')}</div></div></aside><main class="main"><header class="topbar">${iconBtn('mobile-menu','Mở/đóng điều hướng','menu')}<div class="breadcrumb">${I('warehouse')}<span>${h(s().name)}</span><span>/</span><strong>${h(pageMeta[ui.page]?.[0]||'Không tìm thấy')}</strong></div><div class="top-actions"><span class="date subtle">29 tháng 09, 2026 · dữ liệu mẫu</span><span class="pill"><span class="dot"></span>Dark-only</span>${iconBtn('notifications','Việc cần xử lý','bell')}${iconBtn('guide','Hướng dẫn bấm thử','help')}</div></header><div class="demo-banner"><span><strong>UI REVIEW · V2.1.1</strong>Không gửi tin thật · Không dùng API key · Thay đổi dữ liệu chỉ trong phiên</span><button class="text-button" data-action="demo-options">Thử trạng thái ${I('down')}</button></div><div class="page" id="main-content" tabindex="-1">${content}</div></main></div><button class="btn feedback-fab" data-action="feedback">${I('edit')}Góp ý màn hình${ui.feedback.length?' · '+ui.feedback.length:''}</button>`;}
function chart(){const days=['23','24','25','26','27','28','29'];const amounts=days.map(d=>s().orders.filter(o=>o.date==='2026-09-'+d&&o.fulfillment==='fulfilled'&&o.state!=='returned').reduce((a,o)=>a+Number(D.total(o)),0));const max=Math.max(...amounts,100000);const points=amounts.map((v,i)=>[45+i*76,162-v/max*125]);const path=points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');return `<svg class="chart" viewBox="0 0 540 200" role="img" aria-label="Doanh thu giao hàng mô phỏng từ ngày 23 đến 29 tháng 9"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--color-accent)" stop-opacity=".2"/><stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0"/></linearGradient></defs>${[35,78,120,162].map((y,i)=>`<line x1="43" y1="${y}" x2="516" y2="${y}"/><text x="0" y="${y+3}">${Math.round(max*(3-i)/3/1000)}k</text>`).join('')}<path class="area" d="${path} L501,162 L45,162 Z"/><path class="line" d="${path}"/>${points.map((p,i)=>`<circle class="point" cx="${p[0]}" cy="${p[1]}" r="4"><title>${days[i]}/09: ${money(amounts[i])}</title></circle><text x="${p[0]-10}" y="188">${days[i]}/09</text>`).join('')}</svg>`;}
function kpi(label,value,desc,icon,page){return `<a href="#/${page}" class="card kpi"><div class="kpi-label">${h(label)}${I(icon)}</div><div class="kpi-number">${h(value)}</div><div class="kpi-info">${h(desc)}</div></a>`;}
function overview(){const t=D.tally(s()),open=s().conversations.filter(c=>c.status==='open').length,low=s().products.filter(p=>D.available(p)<=p.threshold).length,pending=s().orders.filter(o=>['draft','confirmed'].includes(o.state)).length;return head('Một ngày bán hàng, trong tầm tay.','Chào Jokertrader. Đây là những việc cần bạn chú ý hôm nay.',btn('guide','Hướng dẫn bấm thử','play','ghost')+(can('orders.write')?btn('new-order','Tạo đơn hàng','plus','primary'):''),'TỔNG QUAN CỬA HÀNG')+
 `<div class="grid four">${kpi('Doanh thu giao hàng',can('finance.read')?money(t.revenue):'Bị hạn chế','Tổng của 7 ngày trong bộ dữ liệu','wallet',can('finance.read')?'finance':'orders')}${kpi('Đơn hàng',s().orders.length+' đơn',pending+' đơn cần xử lý','orders','orders')}${kpi('Hội thoại đang mở',open+' hội thoại','Dữ liệu hội thoại mô phỏng','inbox','inbox')}${kpi('Sản phẩm sắp hết',low+' SKU','Bao gồm cả sản phẩm hết hàng','box','inventory')}</div>
 <div class="grid wide" style="margin-top:22px"><div class="stack"><section class="card"><div class="card-head"><div><h2>Nhịp bán hàng</h2><p class="subtle">Doanh thu đã giao · 23–29/09/2026</p></div>${badge('7 ngày mẫu','blue')}</div><div class="summary-block"><strong>${can('finance.read')?money(t.revenue):'Quyền bị hạn chế'}</strong>${badge('Mô phỏng')}</div><div class="card-body"><div class="chart-caption"><span><i></i>Doanh thu giao hàng</span><span>Chưa phải tiền thực thu</span></div>${can('finance.read')?chart():empty('Không có quyền xem số tiền','Chọn vai trò Chủ shop để xem ví dụ tài chính.')}</div></section><section class="card"><div class="card-head"><h2>Đơn hàng gần đây</h2>${link('orders','Xem tất cả →','','text-button')}</div>${orderTable(s().orders.slice(-4).reverse(),true)}</section></div>
 <div class="stack"><section class="card"><div class="card-head"><h2>Cần xử lý</h2>${badge((pending+low)+' việc','warn')}</div><div class="card-body" style="padding-top:8px">${[[pending,'Đơn hàng chờ xử lý','Kiểm tra trước khi xác nhận','orders','orders',''],[low,'Mặt hàng sắp hết','Bổ sung hàng để tránh lỡ đơn','inventory','box','warn'],[s().reviews.length,'Phản hồi cần duyệt','Giúp bot có nguồn trả lời tốt hơn','reviews','book','good']].map(([n,title,desc,p,ic,cl])=>`<a class="task-row" href="#/${p}"><div class="task-icon ${cl}">${I(ic)}</div><div class="grow"><p>${n} ${h(title.toLowerCase())}</p><span class="subtle">${h(desc)}</span></div>${I('chevron')}</a>`).join('')}</div></section><section class="hero-mini"><div class="row between"><div class="row"><div class="bot-orb">${I('bot')}</div><div><h3>Trợ lý bán hàng</h3><span class="subtle">Kịch bản phản hồi mô phỏng</span></div></div>${badge(s().bot.enabled?'Đang bật':'Tạm dừng',s().bot.enabled?'good':'warn')}</div><p>Kiểm tra cách bot trả lời từ sản phẩm và nguồn kiến thức đã duyệt trước khi kết nối AI thật.</p>${link('playground','Vào phòng thử bot','spark','btn ghost')}</section><section class="card card-pad"><div class="row">${I('shield')}<h3>Kiểm soát ngay từ đầu</h3></div><p class="inline-note">Một theme dark. Kiến thức có phê duyệt. Dữ liệu giữa các shop được tách trong demo.</p><button class="text-button" data-action="demo-options" style="margin-top:10px">Thử vai trò và lỗi ${I('arrow')}</button></section></div></div>`;}
function orderTable(orders,compact=false){return table(compact?['Mã đơn / khách','Tổng đơn','Trạng thái']:['Mã đơn','Khách hàng','Ngày','Tổng đơn','Trạng thái','Thanh toán',''],orders.map(o=>`<tr><td><button class="product-name accent" data-action="order-detail" data-id="${o.id}">${h(o.id)}</button>${compact?`<div class="subtle">${h(customer(o.customerId).name)}</div>`:''}</td>${!compact?`<td>${h(customer(o.customerId).name)}</td><td class="muted">${h(o.date.slice(8))}/09/2026</td>`:''}<td class="mono">${money(D.total(o))}</td><td>${orderBadge(o)}</td>${!compact?`<td>${o.payment==='paid'?badge('Đã thu','good'):o.payment==='refunded'?badge('Đã hoàn','warn'):badge('Chưa thu')}</td><td>${rowAction('order-detail',o.id,'Xem đơn '+o.id,'chevron')}</td>`:''}</tr>`));}
function orders(){const q=ui.query.toLocaleLowerCase('vi'),items=s().orders.filter(o=>(o.id+' '+customer(o.customerId).name).toLocaleLowerCase('vi').includes(q)&&(ui.filter==='all'||o.state===ui.filter)).reverse();return head('Đơn hàng','Từ hội thoại đến đơn hàng, giữ hàng và thu tiền.',can('orders.write')?btn('new-order','Tạo đơn hàng','plus','primary'):'')+banner('Luồng demo: <b>Nháp → Xác nhận & giữ hàng → Xuất kho → Thu tiền</b>. Có thể thu tiền trước xuất kho. Không tạo vận đơn hoặc thanh toán thật.')+`<section class="card">${searchBar('Tìm mã đơn hoặc khách hàng…',[['all','Tất cả trạng thái'],['draft','Nháp'],['confirmed','Đã xác nhận'],['completed','Hoàn tất'],['cancelled','Đã hủy'],['returned','Đã hoàn']])}${orderTable(items)}${footer(items.length,'đơn hàng')}</section>`;}
function products(){const items=s().products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(ui.query.toLowerCase())&&(ui.filter==='all'||(ui.filter==='active'?p.active:!p.active)));return head('Sản phẩm','Nguồn dữ liệu thống nhất cho người bán và trợ lý AI.',`${can('catalog.import')?link('imports','Nhập dữ liệu','upload'):''}${can('catalog.write')?btn('product-form','Thêm sản phẩm','plus','primary'):''}`)+tabs([['products','Tất cả sản phẩm'],['categories','Danh mục'],...(can('catalog.import')?[['imports','Nhập dữ liệu']]:[])],ui.page)+`<section class="card">${searchBar('Tìm tên sản phẩm, SKU…',[['all','Tất cả trạng thái'],['active','Đang bán'],['archived','Ngừng bán']])}${table(['Sản phẩm','SKU','Danh mục','Giá bán','Khả dụng','Trạng thái',''],items.map((p,i)=>`<tr><td><div class="product-cell">${thumb(p,i)}<div><button class="product-name" data-action="product-form" data-id="${p.id}">${h(p.name)}</button><div class="subtle">${h(p.variant)}</div></div></div></td><td class="muted">${h(p.sku)}</td><td>${h(p.category)}</td><td class="mono">${money(p.price)}</td><td>${can('inventory.read')?D.available(p):'Bị hạn chế'}</td><td>${badge(p.active?'Đang bán':'Ngừng bán',p.active?'good':'')}</td><td>${rowAction('product-form',p.id,can('catalog.write')?'Sửa '+p.name:'Xem '+p.name,can('catalog.write')?'edit':'eye')}</td></tr>`))}${footer(items.length,'sản phẩm')}</section>`;}
function categories(){return head('Danh mục hàng hóa','Tổ chức sản phẩm theo nhóm để quản lý và tìm kiếm.',can('catalog.write')?btn('category-form','Thêm danh mục','plus','primary'):'')+tabs([['products','Tất cả sản phẩm'],['categories','Danh mục'],...(can('catalog.import')?[['imports','Nhập dữ liệu']]:[])],ui.page)+`<div class="grid three">${s().categories.map((c,i)=>`<div class="card source-card"><div class="source-icon">${I(['shirt','pants','bag'][i%3])}</div><h3>${h(c)}</h3><p>${s().products.filter(p=>p.category===c).length} sản phẩm thuộc danh mục.</p>${btn('view-category','Xem sản phẩm','arrow','ghost',`data-id="${h(c)}"`)}</div>`).join('')}</div>`;}
function inventory(){const ps=s().products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(ui.query.toLowerCase())&&(ui.filter==='all'||D.available(p)<=p.threshold));return head('Tồn kho','Biết rõ số đang có, đã giữ và còn có thể bán.',can('inventory.adjust')?btn('stock-form','Điều chỉnh tồn','plus','primary'):'')+tabs([['inventory','Số lượng tồn'],['movements','Lịch sử biến động']],ui.page)+banner('Trong demo có <b>một kho mặc định mỗi shop</b>. Khả dụng = Tồn thực tế − Đã giữ cho đơn. Điều chỉnh bắt buộc có lý do.')+`<section class="card">${searchBar('Tìm tên hoặc SKU…',[['all','Tất cả mặt hàng'],['low','Sắp hết / hết hàng']])}${table(['Sản phẩm / SKU','Thực tế','Đã giữ','Khả dụng','Ngưỡng cảnh báo','Tình trạng',''],ps.map((p,i)=>`<tr><td><div class="product-cell">${thumb(p,i)}<div>${h(p.name)}<div class="subtle">${h(p.sku)}</div></div></div></td><td class="mono">${p.onHand}</td><td class="mono muted">${p.reserved}</td><td class="mono ${D.available(p)<=p.threshold?'warn':''}"><b>${D.available(p)}</b></td><td>${p.threshold}</td><td>${stockBadge(p)}</td><td>${can('inventory.adjust')?rowAction('stock-form',p.id,'Điều chỉnh '+p.name,'edit'):''}</td></tr>`))}${footer(ps.length,'SKU')}</section>`;}
function movements(){return head('Lịch sử biến động kho','Mỗi thay đổi đều có sản phẩm, số lượng và lý do.',link('inventory','Quay lại tồn kho','arrow'))+tabs([['inventory','Số lượng tồn'],['movements','Lịch sử biến động']],ui.page)+banner('Nhật ký mẫu chỉ chứa giao dịch của fixture gốc và thao tác trong phiên. Tồn mở đầu của các sản phẩm minh họa bổ sung không phải lịch sử kho đầy đủ.')+`<section class="card">${table(['Sản phẩm','Biến động','Lý do','Ngày'],s().movements.map(m=>`<tr><td>${h(s().products.find(p=>p.id===m.productId)?.name||m.productId)}</td><td class="${m.change>0?'good':'warn'}">${m.change>0?'+':''}${m.change}</td><td>${h(m.reason)}</td><td>${h(m.date)}</td></tr>`))}</section>`;}
function inbox(){const c=s().conversations.find(x=>x.id===ui.conversation)||s().conversations[0];if(c)ui.conversation=c.id;const cust=c?customer(c.customerId):null;return head('Hộp thư','Khách cần câu trả lời. Bạn luôn có quyền tiếp quản.',(can('conversations.reply')?btn('new-message','Thêm tin nhắn mẫu','plus','ghost'):''))+`<section class="card inbox"><div class="chat-list"><div class="chat-list-head"><div class="row between"><h3>Tất cả hội thoại</h3>${badge(s().conversations.filter(c=>c.status==='open').length+' đang mở','blue')}</div></div>${s().conversations.map(cv=>{let cc=customer(cv.customerId);return `<button class="chat-item ${cv.id===c?.id?'active':''}" data-action="select-conversation" data-id="${cv.id}">${avatar(cc)}<div class="grow"><div class="row between"><strong>${h(cc.name)}</strong>${cv.unread?badge(cv.unread,'blue'):''}</div><div class="preview">${h(cv.messages.at(-1)?.text||'Hội thoại mới')}</div><div style="margin-top:6px">${badge(cv.mode==='bot'?'Bot AI':'Nhân viên',cv.mode==='bot'?'blue':'warn')}${!cv.eligible?' '+badge('Gửi bị chặn','bad'):''}</div></div></button>`;}).join('')||empty('Chưa có hội thoại','Shop này chưa có dữ liệu chat mô phỏng.')}</div>${c?`<div class="chat-area"><div class="chat-head"><div class="row">${avatar(cust)}<div><strong>${h(cust.name)}</strong><div class="subtle">Messenger mẫu · ${h(c.status==='resolved'?'Đã xử lý':'Đang mở')}</div></div></div><div class="row">${can('conversations.assign')?btn('takeover',c.mode==='bot'?'Tiếp quản':'Trả lại bot',c.mode==='bot'?'users':'bot','small ghost',`data-id="${c.id}"`):''}${can('conversations.assign')?iconBtn('resolve',c.status==='resolved'?'Mở lại hội thoại':'Đánh dấu đã xử lý','check',`data-id="${c.id}"`):''}</div></div><div class="chat-messages" id="chat-scroll"><div class="day-divider">29 tháng 09, 2026 · tất cả tin nhắn là mẫu</div>${c.messages.map(m=>`<div class="message ${h(m.from)}"><div class="bubble">${h(m.text)}</div><div class="meta">${m.from==='bot'?I('bot'):''}<span>${h({bot:'Bot AI · mô phỏng',customer:cust.name,agent:'Bạn · gửi mô phỏng',note:'GHI CHÚ NỘI BỘ'}[m.from])}</span><span>${h(m.time)}</span></div>${m.source?`<div class="source">${I('book')}${h(m.source)}</div>`:''}</div>`).join('')}</div><form id="form-reply" class="composer" data-id="${c.id}">${!c.eligible?`<div class="small warn">${I('lock')} Không đủ điều kiện gửi theo kịch bản demo. Không tự gửi lại.</div>`:''}<label class="subtle" for="reply-text">${c.mode==='bot'?'Tiếp quản trước khi trả lời trực tiếp':'Nội dung trả lời'}</label><textarea id="reply-text" name="text" maxlength="2000" placeholder="Nhập câu trả lời hoặc ghi chú mẫu…" ${!editable('conversations.reply')?'disabled':''}></textarea><div class="composer-footer"><select name="kind" aria-label="Loại nội dung" class="control compact"><option value="reply">Trả lời khách (mẫu)</option><option value="note">Ghi chú nội bộ</option></select><button class="btn primary small" type="submit" ${!editable('conversations.reply')?'disabled':''}>${I('send')}Gửi mô phỏng</button></div><div class="form-error" role="alert"></div></form></div><aside class="chat-context"><div class="row">${avatar(cust)}<div><h3>${h(cust.name)}</h3><span class="subtle">Hồ sơ giả lập</span></div></div><div class="context-section"><h3>Khách hàng</h3><p>${h(cust.phone)}</p><div style="margin-top:9px">${badge(cust.tag,'blue')}</div>${can('customers.read')?btn('customer-form','Xem hồ sơ','users','small ghost',`data-id="${c.customerId}"`):''}</div><div class="context-section"><h3>Đơn hàng liên quan</h3>${s().orders.filter(o=>o.customerId===c.customerId).slice(-2).map(o=>`<button class="text-button small" data-action="order-detail" data-id="${o.id}">${h(o.id)} · ${money(D.total(o))}</button>`).join('<br>')||'<p>Chưa có đơn hàng.</p>'}${can('orders.write')?btn('new-order','Tạo đơn từ hội thoại','plus','primary small',`data-customer="${c.customerId}"`):''}</div><div class="context-section"><h3>Nguồn trả lời</h3><p>Giá và tồn: dữ liệu sản phẩm mẫu.<br>Chính sách: chỉ nguồn đã duyệt.</p>${can('knowledge.write')?btn('answer-feedback','Đánh dấu cần cải thiện','edit','small ghost',`data-id="${c.id}"`):''}</div></aside>`:`<div class="chat-area">${empty('Bắt đầu với một hội thoại mẫu','Bấm “Thêm tin nhắn mẫu” để thử luồng hộp thư.',btn('new-message','Thêm hội thoại mẫu','plus','primary'))}</div>`}</section>`;}
function customers(){const items=s().customers.filter(c=>(c.name+' '+c.tag).toLowerCase().includes(ui.query.toLowerCase()));return head('Khách hàng','Hồ sơ, ghi chú và lịch sử mua hàng trong từng cửa hàng.',can('customers.write')?btn('customer-form','Thêm khách mẫu','plus','primary'):'')+`<section class="card">${searchBar('Tìm tên hoặc nhóm khách…')}${table(['Khách hàng','Liên hệ mẫu','Nhóm khách','Số đơn',''],items.map(c=>`<tr><td><div class="row">${avatar(c)}<button class="product-name" data-action="customer-form" data-id="${c.id}">${h(c.name)}</button></div></td><td class="muted">${h(c.phone)}</td><td>${badge(c.tag,'blue')}</td><td>${s().orders.filter(o=>o.customerId===c.id).length}</td><td>${rowAction('customer-form',c.id,'Xem hồ sơ '+c.name,'chevron')}</td></tr>`))}${footer(items.length,'khách hàng')}</section>`;}
function finance(){const t=D.tally(s());return head('Thu chi & lợi nhuận','Tách rõ tiền trong quỹ, doanh thu và kết quả bán hàng.',can('finance.post')?btn('expense-form','Ghi khoản chi mẫu','plus','primary'):'')+tabs([['finance','Tổng quan'],['entries','Sổ thu chi'],['profit','Lợi nhuận quản trị']],ui.page)+banner('<b>Tài chính quản trị mô phỏng</b> — Không phải sổ kế toán pháp định hoặc chứng từ thuế. Mua hàng nhập kho là dòng tiền ra; giá vốn chỉ ghi theo số hàng đã giao.')+`<div class="grid four">${kpi('Tiền đã thu',money(t.receipts),'Từ các đơn có trạng thái đã thu','wallet','entries')}${kpi('Tiền đã chi',money(t.disbursements),'Nhập hàng + chi phí vận hành','orders','entries')}${kpi('Biến động tiền thuần',money(t.cash),'Không phải số dư tài khoản','chart','entries')}${kpi('Lợi nhuận quản trị',money(t.profit),'Doanh thu − giá vốn − chi phí','chart','profit')}</div><div class="grid two" style="margin-top:22px"><section class="card card-pad"><h2>Kết quả kinh doanh</h2><p class="subtle" style="margin:6px 0 16px">Toàn bộ kỳ dữ liệu mẫu · VND</p>${[['Doanh thu giao hàng',t.revenue],['Giá vốn đã giao',t.cogs],['Lợi nhuận gộp',t.gross],['Chi phí vận hành',t.operating]].map(([l,v])=>`<div class="detail-line"><span>${l}</span><strong class="mono">${money(v)}</strong></div>`).join('')}<div class="detail-line total"><span>Lợi nhuận quản trị</span><strong class="${t.profit>=0?'good':'bad'}">${money(t.profit)}</strong></div></section><section class="card card-pad"><h2>Hiểu số liệu bằng một ví dụ</h2><p class="inline-note">Fixture gốc trong tài liệu 1.1:</p><div class="step"><div class="step-number">1</div><div><h3>Nhập 10 áo × 100.000 ₫</h3><p>Chi tiền 1.000.000 ₫, nhưng chưa phải chi phí của toàn bộ hàng đã bán.</p></div></div><div class="step"><div class="step-number">2</div><div><h3>Bán 2 áo × 150.000 ₫</h3><p>Doanh thu 300.000 ₫ · giá vốn 200.000 ₫.</p></div></div><div class="step"><div class="step-number">3</div><div><h3>Lợi nhuận gộp: 100.000 ₫</h3><p>Còn 8 áo trong kho. Biến động tiền của riêng ví dụ là −700.000 ₫.</p></div></div><p class="inline-note">Dashboard có thêm sản phẩm/đơn mẫu để bạn duyệt bố cục; tổng được tính lại từ dữ liệu đó.</p></section></div>`;}
function entries(){let rows=s().orders.filter(o=>['paid','refunded'].includes(o.payment)).map(o=>({id:o.id,type:o.payment==='paid'?'Thu từ đơn':'Thu & hoàn đơn',amount:o.payment==='paid'?D.total(o):0n,note:o.payment==='paid'?'Thu tiền '+o.id:'Đã thu '+money(D.total(o))+' và hoàn toàn bộ '+money(D.total(o)),date:o.date}));rows=rows.concat(s().expenses.map(e=>({id:e.id,type:e.type==='inventory'?'Chi nhập kho':'Chi vận hành',amount:-D.money(e.amount),note:e.note,date:e.date})));return head('Sổ thu chi','Các khoản thu/chi mẫu, liên kết với đơn và lý do phát sinh.',btn('export-cash','Xuất CSV mẫu','download','ghost')+(can('finance.post')?btn('expense-form','Ghi khoản chi','plus','primary'):''))+tabs([['finance','Tổng quan'],['entries','Sổ thu chi'],['profit','Lợi nhuận quản trị']],ui.page)+`<section class="card">${table(['Mã tham chiếu','Loại','Diễn giải','Số tiền thuần','Ngày'],rows.map(e=>`<tr><td>${h(e.id)}</td><td>${badge(e.type,e.amount>0?'good':'warn')}</td><td>${h(e.note)}</td><td class="mono ${e.amount>=0?'good':'warn'}">${money(e.amount)}</td><td>${h(e.date)}</td></tr>`))}${footer(rows.length)}</section>`+banner('Đơn hoàn trong demo được trình bày gộp thu và hoàn về 0. Bản production cần nhật ký bút toán thu/hoàn độc lập, không thay thế bằng dòng thuần này.');}
function profit(){const t=D.tally(s());return head('Lợi nhuận quản trị','Dựa trên ảnh chụp giá bán và giá vốn tại lúc tạo đơn mẫu.',btn('export-profit','Xuất báo cáo mẫu','download','ghost'))+tabs([['finance','Tổng quan'],['entries','Sổ thu chi'],['profit','Lợi nhuận quản trị']],ui.page)+`<section class="card card-pad"><div class="row between"><h2>Kỳ dữ liệu mô phỏng · 23–29/09/2026</h2>${badge('VND','blue')}</div>${[['Doanh thu thuần đã giao',t.revenue],['Giá vốn',t.cogs],['Lợi nhuận gộp',t.gross],['Chi phí vận hành',t.operating]].map(([l,v])=>`<div class="detail-line"><span>${l}</span><strong>${money(v)}</strong></div>`).join('')}<div class="detail-line total"><span>Lợi nhuận quản trị</span><strong class="good">${money(t.profit)}</strong></div></section>`+`<div style="margin-top:20px">${banner('Demo không tính thuế, quy đổi ngoại tệ, khuyến mãi phức tạp, đối soát COD hoặc phân bổ chi phí. Hãy ghi góp ý nếu các phần này cần có trước khi chốt phạm vi.')}</div>`;}
function knowledge(){return head('Nguồn kiến thức','Bot chỉ dùng nguồn được duyệt. Hội thoại chưa phải kiến thức.',can('knowledge.write')?btn('knowledge-form','Thêm nguồn kiến thức','plus','primary'):'')+tabs([['knowledge','Nguồn của cửa hàng'],['reviews','Phản hồi cần xử lý']],ui.page)+`<div class="grid three">${s().knowledge.map(k=>`<article class="card source-card"><div class="row between"><div class="source-icon">${I('file')}</div>${badge(k.status==='published'?'Đã duyệt':'Bản nháp',k.status==='published'?'good':'warn')}</div><h3>${h(k.name)}</h3><p>${h(k.content.slice(0,110))}${k.content.length>110?'…':''}</p><div class="row between"><span class="subtle">${h(k.type)} · v${k.version}</span>${btn('knowledge-form','Xem & chỉnh sửa','edit','small ghost',`data-id="${k.id}"`)}</div></article>`).join('')}</div>`+`<div style="margin-top:20px">${banner('Giá và số lượng tồn không lấy từ bài viết này. Phòng thử bot tra cứu trực tiếp dữ liệu sản phẩm trong phiên.')}</div>`;}
function reviews(){return head('Phản hồi cần xử lý','Biến tình huống trả lời chưa tốt thành đề xuất có người duyệt.',link('knowledge','Xem nguồn kiến thức','book'))+tabs([['knowledge','Nguồn của cửa hàng'],['reviews','Phản hồi cần xử lý']],ui.page)+`<section class="card">${s().reviews.length?s().reviews.map(r=>`<div class="feedback-card"><div class="row between"><h3>${h(r.title)}</h3>${badge(r.status==='pending'?'Chờ xử lý':'Đã tạo nháp',r.status==='pending'?'warn':'good')}</div><p>${h(r.content)}</p><div class="row between"><span class="subtle">Nguồn: ${h(r.source)}</span>${can('knowledge.write')&&r.status==='pending'?btn('review-to-draft','Tạo bản nháp kiến thức','plus','small primary',`data-id="${r.id}"`):''}</div></div>`).join(''):empty('Chưa có phản hồi','Thử “Đánh dấu cần cải thiện” trong một hội thoại.')}</section>`;}
const botTabs=()=>tabs([['bot','Cấu hình'],...(can('bot.configure')?[['playground','Phòng thử bot']]:[]),['evaluations','Kiểm thử chất lượng']],ui.page);
function bot(){const b=s().bot;return head('Điều khiển bot','Giọng điệu, giới hạn và các tình huống chuyển nhân viên.',can('bot.configure')?link('playground','Thử trước khi dùng','play','btn primary'):'')+botTabs()+`<div class="grid wide"><section class="card card-pad"><h2>Cách bot tư vấn</h2><form id="form-bot" style="margin-top:20px">${select('Giọng điệu','tone',[['Thân thiện, ngắn gọn','Thân thiện, ngắn gọn'],['Lịch sự, chuyên nghiệp','Lịch sự, chuyên nghiệp'],['Gần gũi, tự nhiên','Gần gũi, tự nhiên']],b.tone)}${area('Chỉ dẫn của cửa hàng','instructions',b.instructions,'maxlength="2000" required')}${field('Ngân sách tháng — chỉ là giá trị minh họa (VND)','maxBudget',b.maxBudget,'number','min="0" max="1000000000000" required')}<div class="banner">${I('lock')}Không có tác dụng giới hạn chi phí thật. Phần production phải kiểm ngân sách tại backend.</div><p class="inline-note">Giọng điệu và chỉ dẫn được lưu để duyệt form; câu trả lời lập trình sẵn trong demo không tự thay đổi theo hai trường này.</p><div class="form-error" role="alert"></div><button class="btn primary" type="submit" ${!editable('bot.configure')?'disabled':''}>Lưu cấu hình demo</button></form></section><div class="stack"><section class="card card-pad"><div class="row between"><h2>Trạng thái bot mẫu</h2>${badge(b.enabled?'Đang bật':'Tạm dừng',b.enabled?'good':'warn')}</div><div class="switch-row"><div><h3>Cho phép phản hồi mẫu</h3><p>Chỉ tác động tới phòng thử bot.</p></div><button class="switch" role="switch" aria-label="Bật phản hồi bot mẫu" aria-checked="${b.enabled}" data-action="toggle-bot" ${!editable('bot.publish')?'disabled':''}></button></div><div class="switch-row"><div><h3>Không biết → chuyển người</h3><p>Không bịa chính sách hoặc tồn kho.</p></div>${badge('Bắt buộc','good')}</div></section><section class="card card-pad"><h2>Quy trình xuất bản thật</h2>${[['Soạn cấu hình','Thay đổi trong bản nháp.'],['Kiểm thử & duyệt','Đối chiếu bộ câu hỏi và nguồn.'],['Xuất bản có kiểm soát','Chỉ sau khi tích hợp backend và được phê duyệt.']].map(([a,b],i)=>`<div class="step"><div class="step-number">${i+1}</div><div><h3>${a}</h3><p>${b}</p></div></div>`).join('')}<span class="subtle">Demo không xuất bản ra Facebook.</span></section></div></div>`;}
function mockReply(question){const q=question.toLocaleLowerCase('vi');if(!s().bot.enabled)return {text:'Bot đang tạm dừng trong demo. Hãy bật tại Điều khiển bot để tiếp tục.',source:'Cấu hình mẫu'};const p=s().products.find(p=>p.active&&(q.includes(p.sku.toLowerCase())||q.includes(p.name.toLowerCase())||(q.includes('essential')&&p.sku==='AO-002')||(q.includes('linen')&&p.sku==='QU-003')||(q.includes('mũ')&&p.sku==='MU-006')));if(p)return {text:`${p.name} (${p.variant}) có giá ${money(p.price)}. ${D.available(p)>0?'Hiện còn '+D.available(p)+' sản phẩm khả dụng trong kho mẫu.':'Hiện hết hàng; mình không thể xác nhận đặt hàng.'} Bạn cần mình hỗ trợ thêm không?`,source:`Sản phẩm ${p.sku} · giá và tồn trong phiên`};if(q.includes('giao hàng')||q.includes('phí ship')){const k=s().knowledge.find(k=>k.name.toLowerCase().includes('giao hàng')&&k.status==='published');if(k)return{text:k.content,source:k.name+' · v'+k.version+' · đã duyệt'};}return {text:'Mình chưa có đủ dữ liệu đã duyệt để trả lời chính xác. Mình sẽ chuyển nhân viên kiểm tra, thay vì tự đoán thông tin cho bạn.',source:'Quy tắc không biết → chuyển nhân viên'};}
function playground(){return head('Phòng thử bot','Thử cách trả lời và xem nguồn. Không gọi mô hình AI thật.',btn('clear-play','Xóa phiên thử','refresh','ghost'))+botTabs()+banner('<b>Phản hồi theo kịch bản lập trình sẵn</b>, không phải khả năng của một mô hình AI. Câu hỏi sản phẩm được đối chiếu với giá/tồn mẫu ngay trong phiên.')+`<div class="grid wide"><section class="card"><div class="chat-head"><div class="row"><div class="avatar">${I('bot')}</div><div><h3>Bot của ${h(s().name)}</h3><p class="subtle">Sandbox UI · không gửi ra ngoài</p></div></div>${badge('Kịch bản mẫu','blue')}</div><div class="chat-messages" style="min-height:220px;max-height:450px" id="play-scroll">${ui.play.length?ui.play.map(m=>`<div class="message ${m.from}"><div class="bubble">${h(m.text)}</div>${m.source?`<div class="source">${I('book')}${h(m.source)}</div>`:''}</div>`).join(''):empty('Bạn thử hỏi bot một câu nhé','Chọn câu mẫu bên cạnh hoặc nhập SKU, tên sản phẩm trong cửa hàng.')}</div><form id="form-play" class="composer"><label class="subtle" for="play-input">Câu hỏi mẫu</label><div class="row"><input class="control" name="question" id="play-input" maxlength="500" required placeholder="Áo thun Essential giá bao nhiêu?"><button class="btn primary" type="submit">${I('send')}Thử</button></div><div class="form-error" role="alert"></div></form></section><section class="card card-pad"><h2>Câu hỏi gợi ý</h2><p class="inline-note">Bấm một câu để chạy kịch bản và xem nguồn trả lời.</p>${['Áo thun Essential giá bao nhiêu?','Quần linen còn bao nhiêu chiếc?','Mũ còn hàng không?','Phí giao hàng thế nào?','Shop có giảm 90% không?'].map(q=>`<button class="guide-choice" data-action="ask-sample" data-text="${h(q)}">${h(q)}</button>`).join('')}<div class="separator"></div><h3>Thử tính cập nhật</h3><p class="inline-note">Qua Tồn kho điều chỉnh AO-002, quay lại hỏi Essential. Câu trả lời sẽ dùng số lượng mới trong phiên.</p></section></div>`;}
function evaluations(){return head('Kiểm thử chất lượng AI','Bản mẫu danh sách kiểm thử; không đánh giá mô hình thật.',can('bot.configure')?btn('run-evals','Chạy kiểm tra kịch bản','play','primary'):'')+botTabs()+banner('Kết quả bên dưới chỉ kiểm tra bộ phản hồi lập trình sẵn và quy tắc demo. Không phải tỷ lệ chính xác, an toàn hay chất lượng của AI thật.')+`<section class="card">${table(['Tình huống','Kỳ vọng','Kết quả trong phiên'],[['Hỏi giá sản phẩm','Dùng giá trong danh mục'],['Hỏi hàng đã hết','Không hứa còn hàng'],['Câu hỏi thiếu nguồn','Chuyển nhân viên'],['Bot tạm dừng','Không sinh câu trả lời bán hàng']].map(([a,b],i)=>`<tr><td>${a}</td><td>${b}</td><td>${ui.evalResults?(ui.evalResults[i]===null?badge('Thiếu dữ liệu thử','warn'):badge(ui.evalResults[i]?'Đạt trên kịch bản':'Chưa đạt',ui.evalResults[i]?'good':'bad')):badge('Chưa chạy')}</td></tr>`))}</section>`;}
function imports(){return head('Nhập dữ liệu sản phẩm','Dán bảng CSV mẫu, kiểm tra rồi xác nhận nhập vào phiên demo.',btn('download-template','Tải CSV mẫu','download','ghost'))+tabs([['products','Tất cả sản phẩm'],['categories','Danh mục'],['imports','Nhập dữ liệu']],ui.page)+banner('Demo nhận <b>CSV đơn giản, tối đa 100 dòng</b>, không hỗ trợ ô có dấu phẩy bên trong hoặc file Excel. Bản production cần luồng tải file, ánh xạ cột và xử lý job theo đặc tả.')+`<section class="card card-pad"><h2>1. Dán dữ liệu hoặc nạp mẫu</h2><div class="row" style="margin:14px 0">${btn('load-import-sample','Nạp 2 dòng minh họa','file','small ghost')}</div><form id="form-import">${area('Các cột: sku,name,price,cost,category','csv',ui.importText||'','required maxlength="30000" placeholder="sku,name,price,cost,category"')}<div class="form-error" role="alert"></div><button class="btn primary" type="submit">${I('check')}Kiểm tra dữ liệu</button></form></section>${ui.importRows?`<section class="card" style="margin-top:20px"><div class="card-head"><h2>2. Kết quả kiểm tra</h2>${badge(ui.importRows.filter(r=>r.error).length+' dòng lỗi',ui.importRows.some(r=>r.error)?'warn':'good')}</div>${table(['Dòng','SKU','Tên','Giá','Kết quả'],ui.importRows.map((r,i)=>`<tr><td>${i+2}</td><td>${h(r.sku)}</td><td>${h(r.name)}</td><td>${h(r.price)}</td><td>${r.error?`<span class="bad">${h(r.error)}</span>`:badge('Hợp lệ','good')}</td></tr>`))}<div class="card-foot"><span>Không nhập khi có dòng lỗi. Không sửa tồn kho bằng file sản phẩm.</span>${btn('commit-import','Xác nhận nhập mẫu','check','primary',ui.importRows.some(r=>r.error)?'disabled':'')}</div></section>`:''}`;}
function channels(){const c=s().channel;return head('Kết nối Facebook','Theo dõi trang bán hàng và tình trạng tích hợp.',btn('channel-connect',c.connected?'Xem kết nối mẫu':'Kết nối trang mẫu','facebook','primary'))+banner('Không đăng nhập Facebook, không nhận webhook và không gửi Messenger thật. Nút kết nối chỉ thay đổi trạng thái mô phỏng trong phiên.')+`<div class="grid two"><section class="card card-pad"><div class="row between"><div class="row"><div class="source-icon avatar large">${I('facebook')}</div><div><h2>${h(c.page)}</h2><p class="subtle">Facebook Messenger · trang giả lập</p></div></div>${badge(c.connected?'Đã nối mẫu':'Chưa kết nối',c.connected?'good':'warn')}</div><div class="separator"></div>${[['Trạng thái OAuth',c.connected?'Mô phỏng đã cấp quyền':'Chưa mô phỏng'],['Webhook','Không có trong bản demo'],['Điều kiện gửi','Theo kịch bản từng hội thoại'],['Page token','Không có key/token thật']].map(([k,v])=>`<div class="detail-line"><span>${k}</span><strong>${v}</strong></div>`).join('')}<div class="row wrap" style="margin-top:20px">${btn('channel-test','Xem trạng thái mô phỏng','refresh','ghost')}${c.connected&&can('integrations.manage')?btn('channel-disconnect','Ngắt kết nối mẫu','plug','danger'):''}</div></section><section class="card card-pad"><h2>Luồng cần duyệt</h2>${[['Cấp quyền cho trang','OAuth của Meta sẽ mở ngoài ứng dụng thật.'],['Xác nhận quyền & webhook','Backend xác thực chữ ký và lưu sự kiện bền vững.'],['Kiểm tra gửi / nhận','Chỉ gửi khi policy và quyền cho phép.'],['Theo dõi lỗi & kết nối lại','Không giấu token hết hạn hoặc tin chưa rõ đã gửi.']].map(([a,b],i)=>`<div class="step"><div class="step-number">${i+1}</div><div><h3>${a}</h3><p>${b}</p></div></div>`).join('')}</section></div>`;}
function providers(){return head('Nhà cung cấp AI','Một nơi cấu hình adapter, mô hình và khả năng cần dùng.',can('integrations.manage')?btn('provider-form','Thêm kết nối mẫu','plus','primary'):'')+banner('<b>Không nhập API key thật vào demo.</b> Màn hình chỉ lưu metadata giả lập trong bộ nhớ. Khóa thật phải được gửi tới backend có bảo vệ, không lưu trong trình duyệt.')+`<div class="grid two">${s().providers.map(p=>`<section class="card card-pad"><div class="row between"><div class="row"><div class="avatar large">${I('spark')}</div><div><h2>${h(p.name)}</h2><p class="subtle">${h(p.adapter)}</p></div></div>${badge('Cấu hình mẫu','blue')}</div><div class="separator"></div><div class="detail-line"><span>Mô hình minh họa</span><strong>${h(p.model)}</strong></div><div class="detail-line"><span>API key</span><strong>Không có khóa thật</strong></div><div class="detail-line"><span>Khả năng API</span><strong>Chưa được kiểm chứng</strong></div><div class="row wrap" style="margin-top:20px">${btn('provider-test','Kiểm tra luồng UI','play','ghost',`data-id="${p.id}"`)}${can('integrations.manage')?btn('provider-form','Sửa metadata','edit','ghost',`data-id="${p.id}"`):''}</div></section>`).join('')}<section class="card card-pad"><h2>Không phải mọi API đều giống nhau</h2><p class="inline-note">Bản mẫu minh họa một lớp adapter chung. Khi tích hợp thật cần kiểm riêng: hội thoại, streaming, tool calling, định dạng đầu ra và embeddings.</p><div class="separator"></div><div class="row wrap">${['Chat','Streaming','Tools','Embeddings'].map(x=>badge(x+' · chưa kiểm')).join('')}</div><p class="inline-note">Không hiển thị giá model hoặc tốc độ chưa được xác minh. Demo không thực hiện fallback giữa nhà cung cấp.</p></section></div>`;}
function reports(){const t=D.tally(s());return head('Báo cáo & xuất dữ liệu','Tải dữ liệu giả lập để kiểm tra cấu trúc báo cáo.',link('jobs','Xem công việc nền','clock'))+`<div class="grid three">${[['Doanh thu & lợi nhuận','Tổng doanh thu giao hàng, giá vốn, chi phí và lợi nhuận quản trị.','chart','export-profit',can('finance.read')],['Tồn kho hiện tại','SKU, số lượng thực tế, đã giữ và khả dụng trong phiên.','box','export-stock',can('inventory.read')],['Đơn hàng mẫu','Trạng thái xử lý, tổng đơn và thanh toán của từng đơn.','orders','export-orders',can('orders.read')]].map(([title,desc,ic,action,allowed])=>`<section class="card source-card"><div class="source-icon">${I(ic)}</div><h3>${title}</h3><p>${desc}</p>${btn(action,'Xuất CSV mẫu','download','ghost',(!can('reports.export')||!allowed)?'disabled title="Thiếu quyền xuất hoặc quyền dữ liệu nguồn"':'')}</section>`).join('')}</div><div class="card card-pad" style="margin-top:20px"><h2>Phạm vi báo cáo demo</h2><div class="metric-strip"><div><span>Cửa hàng hiện tại</span><strong>${h(s().name)}</strong></div><div><span>Đơn hàng trong phiên</span><strong>${s().orders.length}</strong></div><div><span>Đơn vị tiền</span><strong>VND</strong></div></div><p class="inline-note">CSV tải ngay từ trình duyệt. Không có job xuất dữ liệu trên server. Biểu đồ/báo cáo chưa có đối soát vận chuyển, thuế hoặc đa tiền tệ.</p></div>`;}
const settingsTabs=()=>tabs([['settings','Cửa hàng','shop.manage'],['team','Nhân sự','members.manage'],['audit','Nhật ký','audit.read'],['privacy','Quyền riêng tư','privacy.manage']].filter(x=>can(x[2])).map(x=>x.slice(0,2)),ui.page);
function settings(){return head('Cài đặt cửa hàng','Thông tin cơ bản và các quyết định nền tảng đã chốt.')+settingsTabs()+`<div class="grid two"><section class="card card-pad"><h2>Thông tin shop mẫu</h2><form id="form-shop" style="margin-top:20px">${field('Tên cửa hàng','name',s().name,'text','required maxlength="80"')}${select('Múi giờ','timezone',[['Asia/Vientiane','Asia/Vientiane'],['Asia/Ho_Chi_Minh','Asia/Ho_Chi_Minh'],['Asia/Bangkok','Asia/Bangkok']],s().timezone)}${field('Tiền tệ gốc — khóa trong demo','currency','VND','text','readonly')}<div class="form-error" role="alert"></div><button class="btn primary" type="submit" ${!editable('shop.manage')?'disabled':''}>Lưu thay đổi mẫu</button></form></section><div class="stack"><section class="card card-pad"><div class="row between"><h2>Giao diện</h2>${badge('ĐÃ CHỐT','blue')}</div><div class="switch-row"><div><h3>Dark-only</h3><p>Một bộ màu từ đặc tả 1.1, áp dụng từ lần hiển thị đầu tiên.</p></div>${I('lock')}</div><p class="inline-note">Không có nút đổi theme. Không có chế độ light/system hoặc tùy chọn lưu theme.</p></section><section class="card card-pad"><h2>Môi trường trình diễn</h2><p class="inline-note">Dữ liệu kinh doanh chỉ ở bộ nhớ của tab. Tải lại sẽ đưa về bộ mẫu. Chỉ góp ý/checklist được lưu cục bộ nếu trình duyệt cho phép.</p><div class="row wrap" style="margin-top:18px">${btn('reset-demo','Đặt lại dữ liệu mẫu','refresh','ghost')}${link('login','Xem màn hình đăng nhập','logout','btn ghost')}</div></section></div></div>`;}
function team(){return head('Nhân sự & quyền','Vai trò là mẫu từ bộ đặc tả. Không mời hoặc gửi email thật.',can('members.manage')?btn('team-form','Thêm thành viên mẫu','plus','primary'):'')+settingsTabs()+banner('Phân quyền tại đây chỉ là <b>mô phỏng hành vi UI</b>. Mã nguồn và dữ liệu demo đều ở máy người xem; không cung cấp bảo mật như backend thật.')+`<section class="card">${table(['Thành viên','Vai trò mẫu','Trạng thái',''],s().team.map(u=>`<tr><td><div class="row">${avatar(u)}${h(u.name)}</div></td><td>${h(u.role)}</td><td>${badge('Thành viên mẫu','blue')}</td><td>${rowAction('team-form',u.id,'Sửa thành viên mẫu','edit')}</td></tr>`))}</section><div class="card card-pad" style="margin-top:20px"><h2>Thử giao diện theo vai trò</h2><p class="inline-note">Đổi sang nhân viên bán hàng: không thấy giá vốn, thu chi và cài đặt AI. Đổi lại Chủ shop để duyệt toàn bộ.</p><div style="margin-top:15px">${btn('demo-options','Chọn vai trò mô phỏng','users','ghost')}</div></div>`;}
function audit(){return head('Nhật ký thao tác','Những thay đổi trong phiên demo, không phải audit log bất biến.')+settingsTabs()+`<section class="card">${table(['Thao tác','Chi tiết','Thời điểm mẫu'],s().audit.map(a=>`<tr><td>${h(a.action)}</td><td>${h(a.detail)}</td><td class="muted">${h(a.date)}</td></tr>`))}${footer(s().audit.length,'sự kiện')}</section>`;}
function privacy(){return head('Quyền riêng tư & lưu trữ','Duyệt trước cách quản lý dữ liệu và yêu cầu xóa.')+settingsTabs()+banner('Các giá trị lưu trữ là <b>đề xuất mô phỏng</b>, chưa phải chính sách được duyệt hoặc kết luận tuân thủ pháp luật.')+`<div class="grid two"><section class="card card-pad"><h2>Chính sách mẫu</h2><form id="form-privacy" style="margin-top:20px">${field('Số ngày lưu hội thoại — giá trị demo','retention',s().privacy.retention,'number','min="1" max="3650" required')}<p class="inline-note">Lưu giá trị này không chạy tác vụ xóa nền. Cần backend, quyền và chính sách thật ở bản triển khai.</p><div class="form-error" role="alert"></div><button class="btn primary" style="margin-top:18px" type="submit">Lưu giá trị mẫu</button></form></section><section class="card card-pad"><h2>Xóa dữ liệu hội thoại mẫu</h2><p class="inline-note">Chỉ xóa các hội thoại của shop hiện tại trong tab này. Không xóa đơn hàng, góp ý UI hoặc dữ liệu ngoài demo. Tải lại sẽ khôi phục dữ liệu mẫu.</p><div style="margin-top:20px">${btn('privacy-delete','Xóa hội thoại mẫu','trash','danger')}</div></section></div>`;}
function jobs(){return head('Công việc trong phiên','Theo dõi việc nhập dữ liệu đã thực hiện trong demo.')+banner('Không có worker/server đang chạy nền. Các bản ghi dưới đây mô tả thao tác thực sự đã hoàn thành trong trình duyệt.')+`<section class="card">${table(['Mã việc','Loại','Kết quả','Trạng thái'],s().jobs.map(j=>`<tr><td>${h(j.id)}</td><td>${h(j.type)}</td><td>${h(j.detail)}</td><td>${badge('Hoàn tất trong demo','good')}</td></tr>`))}</section>`;}
const checklist=[
 ['layout','Bố cục và dark-only','Chữ, bảng, khoảng cách, menu và các hộp thoại dễ nhìn.','overview'],
 ['sales','Hộp thư → tạo đơn','Tiếp quản bot, ghi chú nội bộ và đơn từ hội thoại.','inbox'],
 ['product','Nhập liệu sản phẩm','Tên, SKU, giá, danh mục và quy trình nhập CSV.','products'],
 ['stock','Giữ hàng & tồn kho','Xác nhận đơn giữ hàng, xuất kho giảm tồn, không bán quá tồn.','inventory'],
 ['finance','Thu chi khác lợi nhuận','Xem sổ thu chi và ví dụ giá vốn; xác định phần cần thêm.','finance'],
 ['knowledge','AI chỉ dùng nguồn đã duyệt','Soạn nguồn, xuất bản, đánh dấu câu trả lời cần cải thiện.','knowledge'],
 ['roles','Vai trò, shop và trạng thái lỗi','Thử shop B, nhân viên, mất mạng và dữ liệu trống.','settings'],

function persistReview(){try{localStorage.setItem(REVIEW_KEY,JSON.stringify({feedback:ui.feedback,checks:ui.checks}));storageOK=true;}catch{storageOK=false;toast('Trình duyệt không cho lưu cục bộ. Hãy xuất góp ý trước khi đóng tab.',true);}}
function review(){return head('Góp ý & danh sách cần duyệt','Chốt trải nghiệm trước, rồi mới cập nhật tài liệu cho AI lập trình.',btn('export-review','Xuất góp ý JSON','download','ghost')+btn('feedback','Ghi góp ý mới','plus','primary'))+banner('Góp ý được lưu <b>trên trình duyệt này</b>, không tự gửi cho ChatGPT hoặc AI lập trình. Sau khi duyệt, bấm Xuất góp ý và gửi lại file trong cuộc trò chuyện.'+(storageOK?'':' <b>Hiện không lưu được cục bộ — cần xuất file trước khi đóng.</b>'))+`<div class="grid wide"><section class="card"><div class="card-head"><h2>Góp ý đã ghi</h2>${badge(ui.feedback.length+' góp ý','blue')}</div>${ui.feedback.length?ui.feedback.map(f=>`<article class="feedback-card"><div class="row between"><span>${badge(f.type||'Góp ý','blue')} ${badge(f.priority||'Cần bổ sung',(f.priority||'').includes('gấp')?'warn':'')}</span>${rowAction('delete-feedback',f.id,'Xóa góp ý','trash')}</div><p>${h(f.text)}</p><div class="subtle">${h(f.screen)} · ${h(f.shop)} · ${h(f.date||'')}</div></article>`).join(''):empty('Chưa có góp ý nào','Nút “Góp ý màn hình” luôn ở góc dưới bên phải để ghi lại ngay khi thấy phần thiếu.',btn('feedback','Viết góp ý đầu tiên','edit','primary'))}<div class="card-foot"><span>Góp ý không phải yêu cầu đã được triển khai.</span>${btn('export-review-md','Xuất Markdown','download','small ghost')}</div></section><section class="card card-pad"><h2>Danh sách bạn nên bấm thử</h2><div class="progress"><span style="width:${checklist.filter(x=>ui.checks[x[0]]).length/checklist.length*100}%"></span></div><span class="subtle">${checklist.filter(x=>ui.checks[x[0]]).length}/${checklist.length} mục bạn đã đánh dấu xem</span>${checklist.map(([id,title,desc,page])=>`<div class="check-line"><input type="checkbox" data-check="${id}" id="check-${id}" ${ui.checks[id]?'checked':''}><div class="grow"><label for="check-${id}">${h(title)}</label><p>${h(desc)}</p></div><a href="#/${page}" aria-label="Mở ${h(title)}">${I('chevron')}</a></div>`).join('')}</section></div><section class="card card-pad" style="margin-top:22px"><h2>Phạm vi còn chưa mô phỏng đầy đủ</h2><p class="inline-note">Đăng nhập thật/MFA, Facebook OAuth/webhook, gọi AI/RAG thật, trả hàng từng phần, nhiều kho/chuyển kho, vận chuyển/COD, thuế, realtime nhiều người, cảnh báo và job chạy nền, sao lưu/phục hồi. Đây là danh sách để duyệt và làm rõ, không phải các chức năng đã hoàn thành.</p><div style="margin-top:14px">${btn('coverage','Xem đối chiếu 36 màn hình','file','ghost')}</div></section>`;}
function login(){return `<div class="full-login"><section class="card login-card"><div class="brand"><div class="brand-mark">B</div><div class="brand-name">BotSales<span>AI</span></div></div><h1 id="page-title" tabindex="-1">Chào mừng trở lại</h1><p class="auth-note">Màn hình xem trước. Không nhập tài khoản hoặc mật khẩu thật.</p><form id="form-login">${field('Email mẫu','email','owner@example.invalid','email','readonly')}${field('Mật khẩu mẫu — không gửi đi','password','demo-only','password','readonly')}<div class="form-error" role="alert"></div><button type="submit" class="btn primary" style="width:100%">Vào không gian mẫu ${I('arrow')}</button></form><p class="inline-note">Không xác thực tài khoản, không tạo phiên đăng nhập thật.</p></section></div>`;}
function workspaces(){return head('Chọn cửa hàng','Mỗi cửa hàng dùng một bộ dữ liệu mô phỏng độc lập.',link('onboarding','Xem thiết lập mới','plus','btn ghost'))+`<div class="grid two">${Object.values(state.shops).map(shop=>`<section class="card card-pad"><div class="row"><div class="avatar large">${I('warehouse')}</div><div><h2>${h(shop.name)}</h2><p class="subtle">${shop.currency} · ${h(shop.timezone)}</p></div></div><p class="inline-note">${shop.id===state.activeShop?'Bạn đang ở cửa hàng này.':'Dữ liệu khác shop hiện tại.'}</p><div style="margin-top:20px">${btn('choose-shop','Vào cửa hàng','arrow','primary',`data-id="${shop.id}"`)}</div></section>`).join('')}</div>`;}
function onboarding(){return head('Thiết lập cửa hàng mẫu','Duyệt các thông tin cần có trước khi vào màn hình quản lý.')+`<div class="card card-pad" style="max-width:650px"><form id="form-onboarding">${field('Tên cửa hàng mới','name','','text','required maxlength="80" placeholder="Ví dụ: Shop Mẫu C"')}${field('Tiền tệ gốc trong demo','currency','VND','text','readonly')}${field('Múi giờ mẫu','timezone','Asia/Vientiane','text','readonly')}<p class="inline-note">Tạo một không gian mẫu trống trong bộ nhớ. Không tạo database, tài khoản hoặc kết nối thật.</p><div class="form-error" role="alert"></div><button class="btn primary" style="margin-top:20px" type="submit">Tạo shop mẫu ${I('arrow')}</button></form></div>`;}
function modal(title,body,foot='',wide=false,subtitle='Mô phỏng giao diện · không tác động hệ thống thật'){
 const d=$('#modal');if(d.open)d.close();ui.lastFocus=document.activeElement;d.className='modal'+(wide?' wide':'');d.innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${h(title)}</h2><p>${h(subtitle)}</p></div>${iconBtn('close-modal','Đóng hộp thoại','close')}</div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;d.showModal();
}
function closeModal(){const d=$('#modal');if(d.open)d.close();}
function formModal(title,formId,body,button='Lưu vào demo',attrs='',footExtra=''){
 modal(title,`<form id="${formId}" ${attrs}>${body}<div class="form-error" role="alert"></div></form>`,footExtra+btn('close-modal','Hủy','','ghost')+`<button class="btn primary" type="submit" form="${formId}">${I('check')}${h(button)}</button>`);
}
function toast(text,error=false){const t=document.createElement('div');t.className='toast'+(error?' error':'');t.innerHTML=I(error?'warning':'check')+`<span>${h(text)}</span>`;const zone=$('#toast-zone');zone.append(t);while(zone.children.length>3)zone.firstElementChild.remove();setTimeout(()=>t.remove(),5000);}
function auditAdd(action,detail){s().audit.unshift({id:nextId('A-'),action,detail,date:'2026-09-29 · trong phiên mẫu'});}
function requireEdit(permission){if(!editable(permission))throw new Error(ui.scene==='offline'?'Đang mô phỏng mất mạng. Khôi phục trạng thái bình thường trước khi ghi.':'Thao tác bị chặn bởi quyền hoặc trạng thái thử nghiệm.');}
function actionDone(text,detail=''){if(detail)auditAdd(text,detail);closeModal();render();toast(text+' trong demo.');}
function confirmAction(title,text,action,id='',label='Xác nhận trong demo'){modal(title,`<p class="muted">${h(text)}</p>`,btn('close-modal','Quay lại','','ghost')+btn(action,label,'check','primary',`data-id="${h(id)}"`));}
function productForm(id){const p=s().products.find(p=>p.id===id);if(p&&!can('catalog.write')){modal(p.name,`<div class="row">${thumb(p)}<div><h3>${h(p.variant)}</h3><p class="muted">${h(p.sku)}</p></div></div><div class="detail-line"><span>Giá bán</span><strong>${money(p.price)}</strong></div><p class="inline-note">${h(p.description)}</p>`);return;}requireEdit('catalog.write');formModal(p?'Chỉnh sửa sản phẩm':'Thêm sản phẩm mẫu','form-product',`<div class="form-grid">${field('Tên sản phẩm *','name',p?.name||'','text','required maxlength="120"')}${field('Mã SKU duy nhất trong shop *','sku',p?.sku||'','text','required maxlength="32" pattern="[A-Za-z0-9_-]{2,32}"')}${select('Danh mục','category',s().categories.map(c=>[c,c]),p?.category||s().categories[0])}${field('Phiên bản / kích cỡ','variant',p?.variant||'','text','maxlength="60"')}${field('Giá bán (VND) *','price',p?.price||'','number','required min="0" max="1000000000000" step="1"')}${can('finance.read')?field('Giá vốn mẫu (VND) *','cost',p?.cost||'','number','required min="0" max="1000000000000" step="1"'):''}</div>${area('Mô tả cho người bán và AI','description',p?.description||'','maxlength="2000"')}<p class="inline-note">Không sửa tồn kho tại form này. ${!can('finance.read')?'Giá vốn bị hạn chế theo vai trò; không hiển thị trong form. ':''}Bản demo chỉ có một biến thể mỗi sản phẩm.</p>`,'Lưu sản phẩm mẫu',`data-id="${p?.id||''}"`,p?btn('archive-product',p.active?'Ngừng bán':'Mở bán lại','box','ghost',`data-id="${p.id}"`):'');}
function stockForm(id){requireEdit('inventory.adjust');formModal('Điều chỉnh tồn kho mẫu','form-stock',select('Sản phẩm','productId',s().products.map(p=>[p.id,p.sku+' · '+p.name+' (tồn '+p.onHand+', giữ '+p.reserved+')']),id||s().products[0]?.id)+field('Số lượng tăng / giảm *','delta','','number','required min="-10000" max="10000" step="1" placeholder="Ví dụ: 10 hoặc -2"')+area('Lý do điều chỉnh *','reason','','required minlength="3" maxlength="300"')+banner('Không được giảm tồn thực tế xuống dưới số đang giữ cho đơn. Mỗi thao tác hợp lệ ghi thêm một dòng lịch sử kho.'),'Xác nhận điều chỉnh');}
function orderForm(customerId){requireEdit('orders.write');if(!s().customers.length){toast('Cần tạo khách hàng mẫu trước.',true);return;}if(!s().products.some(p=>p.active)){toast('Cần ít nhất một sản phẩm đang bán.',true);return;}formModal('Tạo đơn hàng nháp','form-order',select('Khách hàng','customerId',s().customers.map(c=>[c.id,c.name]),customerId||s().customers[0].id)+`<div class="field"><label>Sản phẩm & số lượng *</label><div id="order-lines">${orderLine()}</div>${btn('add-order-line','Thêm dòng sản phẩm','plus','small ghost')}</div>`+area('Ghi chú đơn hàng','note','','maxlength="500"')+banner('Đơn nháp <b>chưa giữ hàng và chưa ghi doanh thu</b>. Xác nhận tại chi tiết đơn để kiểm tồn và giữ hàng.'),'Lưu đơn nháp');}
function orderLine(){return `<div class="order-line"><select class="control" name="productId" aria-label="Sản phẩm trong đơn">${s().products.filter(p=>p.active).map(p=>`<option value="${p.id}">${h(p.sku+' · '+p.name)} — ${money(p.price)} (còn ${D.available(p)})</option>`).join('')}</select><input class="control" type="number" name="quantity" aria-label="Số lượng" min="1" max="10000" step="1" value="1" required>${iconBtn('remove-order-line','Bỏ dòng','close')}</div>`;}
function orderDetail(id){if(!can('orders.read'))throw new Error('Bạn không có quyền xem đơn.');const o=s().orders.find(x=>x.id===id);if(!o)throw new Error('Không tìm thấy đơn trong shop hiện tại.');const actions=[];if(o.state==='draft'&&can('orders.confirm'))actions.push(btn('order-command','Xác nhận & giữ hàng','check','primary',`data-id="${id}" data-command="confirm"`));if(o.state==='confirmed'&&o.fulfillment!=='fulfilled'&&can('orders.fulfill'))actions.push(btn('order-command','Xuất kho mẫu','box','primary',`data-id="${id}" data-command="fulfill"`));if(o.state==='confirmed'&&o.payment==='unpaid'&&can('finance.post'))actions.push(btn('order-pay-ask','Ghi nhận đã thu tiền','wallet','ghost',`data-id="${id}"`));if(['draft','confirmed'].includes(o.state)&&o.fulfillment!=='fulfilled'&&o.payment==='unpaid'&&can('orders.write'))actions.push(btn('order-cancel-ask','Hủy đơn','close','danger',`data-id="${id}"`));if(o.state==='completed'&&can('orders.return')&&can('finance.refund'))actions.push(btn('order-return-ask','Hoàn toàn bộ đơn','refresh','ghost',`data-id="${id}"`));modal('Đơn hàng '+id,`<div class="row between"><div>${orderBadge(o)} ${badge(o.payment==='paid'?'Đã thu tiền':o.payment==='refunded'?'Đã hoàn tiền':'Chưa thu',o.payment==='paid'?'good':'warn')}</div><span class="subtle">v${o.version} · ${h(o.date)}</span></div><div class="kv-grid" style="margin:20px 0"><div class="kv"><span>Khách hàng mẫu</span><strong>${h(customer(o.customerId).name)}</strong></div><div class="kv"><span>Kho xuất</span><strong>Kho mặc định của shop</strong></div></div>${table(['Sản phẩm','SL','Đơn giá','Thành tiền'],o.lines.map(l=>`<tr><td>${h(l.name)}<div class="subtle">${h(l.sku+' · '+l.variant)}</div></td><td>${l.quantity}</td><td>${money(l.unitPrice)}</td><td>${money(D.money(l.unitPrice)*BigInt(l.quantity))}</td></tr>`))}<div class="detail-line total"><span>Tổng đơn</span><strong>${money(D.total(o))}</strong></div><p class="inline-note">${h(o.note||'Không có ghi chú.')}</p><div class="step ${o.state!=='draft'?'done':'current'}"><div class="step-number">1</div><div><h3>Xác nhận & giữ hàng</h3><p>Kiểm giá/tồn một lần nữa trước khi giữ.</p></div></div><div class="step ${o.fulfillment==='fulfilled'?'done':'current'}"><div class="step-number">2</div><div><h3>Giao hàng & ghi doanh thu quản trị</h3><p>V2 tách bàn giao, giao khách và đối soát COD.</p></div></div><div class="step ${o.payment==='paid'?'done':''}"><div class="step-number">3</div><div><h3>Ghi nhận tiền đã thu</h3><p>Không xử lý thanh toán, vận đơn hoặc COD thật.</p></div></div>`,actions.join('')||btn('close-modal','Đóng','','ghost'),true);}
function knowledgeForm(id){const k=s().knowledge.find(k=>k.id===id);if(!can('knowledge.write')){modal(k?.name||'Nguồn kiến thức',`<p>${h(k?.content||'Không có nội dung')}</p>`);return;}requireEdit('knowledge.write');formModal(k?'Nguồn kiến thức':'Thêm nguồn kiến thức','form-knowledge',field('Tên nguồn *','name',k?.name||'','text','required maxlength="120"')+select('Loại nội dung','type',[['Chính sách','Chính sách'],['Hướng dẫn','Hướng dẫn'],['Sản phẩm','Sản phẩm']],k?.type||'Chính sách')+area('Nội dung chủ shop xác nhận *','content',k?.content||'','required maxlength="5000"')+banner('Mọi chỉnh sửa lưu thành <b>bản nháp</b>. Chỉ bấm “Duyệt bản đang lưu” khi đã xác nhận nội dung. Nút duyệt không bao gồm thay đổi chưa lưu.'),'Lưu bản nháp',`data-id="${k?.id||''}"`,k&&can('knowledge.publish')?btn('publish-knowledge',k.status==='published'?'Thu hồi bản đã duyệt':'Duyệt bản đang lưu','check','ghost',`data-id="${k.id}"`):'');}
function customerForm(id){const c=s().customers.find(c=>c.id===id);if(c&&!can('customers.write')){modal(c.name,`<p>${h(c.note||'Chưa có ghi chú')}</p><p class="inline-note">${h(c.phone)}</p>`);return;}requireEdit('customers.write');formModal(c?'Hồ sơ khách hàng mẫu':'Thêm khách hàng mẫu','form-customer',field('Tên hiển thị (dữ liệu giả) *','name',c?.name||'','text','required maxlength="100"')+field('Liên hệ mẫu — không nhập PII thật','phone',c?.phone||'','text','maxlength="60"')+select('Nhóm khách','tag',[['Khách mới','Khách mới'],['Khách quay lại','Khách quay lại'],['Thân thiết','Thân thiết']],c?.tag||'Khách mới')+area('Ghi chú chăm sóc','note',c?.note||'','maxlength="1000"'),'Lưu khách mẫu',`data-id="${c?.id||''}"`);}
function providerForm(id){requireEdit('integrations.manage');const p=s().providers.find(p=>p.id===id);formModal('Cấu hình kết nối AI mẫu','form-provider',field('Tên kết nối *','name',p?.name||'','text','required maxlength="80"')+select('Adapter minh họa','adapter',[['OpenAI-compatible','OpenAI-compatible'],['Anthropic','Anthropic (cần adapter riêng)'],['OpenRouter','OpenRouter'],['Custom adapter','Adapter tùy chỉnh']],p?.adapter||'OpenAI-compatible')+field('Tên mô hình minh họa *','model',p?.model||'demo-model','text','required maxlength="80"')+field('API key','demoKey','KHÔNG NHẬP KEY THẬT — bản UI không có backend','text','readonly')+banner('Không kiểm chứng tương thích, giá hay khả năng của nhà cung cấp. Chỉ lưu tên và adapter để bạn duyệt cấu trúc màn hình.'),'Lưu metadata mẫu',`data-id="${p?.id||''}"`);}
function feedbackModal(){formModal('Góp ý cho màn hình này','form-feedback',`<div class="banner">${I('edit')}Màn hình: <b>${h(pageMeta[ui.page]?.[0]||ui.page)}</b> · ${h(s().name)}<br>Góp ý không được gửi đi tự động.</div><div class="form-grid">${select('Loại góp ý','type',[['Thiếu chức năng','Thiếu chức năng'],['Bố cục / dễ sử dụng','Bố cục / dễ sử dụng'],['Nghiệp vụ','Nghiệp vụ'],['Lỗi demo','Lỗi demo'],['Ý tưởng bổ sung','Ý tưởng bổ sung']],'Thiếu chức năng')}${select('Mức ưu tiên','priority',[['Cần chốt trước khi code','Cần chốt trước khi code'],['Quan trọng','Quan trọng'],['Có thể bổ sung sau','Có thể bổ sung sau']],'Cần chốt trước khi code')}</div>${area('Bạn cần bổ sung hoặc thay đổi điều gì? *','text','','required minlength="5" maxlength="2000" placeholder="Ví dụ: Tôi muốn màn hình tồn kho có thêm cột nhà cung cấp…"')}`,'Lưu góp ý trên máy');}
function demoOptions(){formModal('Tùy chọn bấm thử','form-options',select('Vai trò mô phỏng','role',Object.entries(roleNames),state.role)+select('Trạng thái màn hình','scene',[['normal','Bình thường'],['loading','Đang tải'],['empty','Chưa có dữ liệu'],['error','Lỗi máy chủ mẫu'],['offline','Mất mạng (chặn thao tác ghi)'],['stale','Dữ liệu cũ (chặn thao tác ghi)'],['forbidden','Không có quyền']],ui.scene)+banner('Đây là bộ điều khiển để duyệt UI. Mất mạng, lỗi và phân quyền được mô phỏng, không phải backend thật.'),'Áp dụng trạng thái thử');}
function guide(){modal('Một vòng bấm thử, từ khách đến đơn hàng',`<p class="muted small">Bạn có thể bấm các mục theo thứ tự, hoặc đi thẳng tới màn hình muốn xem.</p>${[['inbox','01 · Nhận hội thoại','Chọn Linh, bấm Tiếp quản; thử trả lời và ghi chú.'],['products','02 · Kiểm tra sản phẩm','Thêm/sửa sản phẩm; thử SKU bị trùng hoặc giá không hợp lệ.'],['orders','03 · Tạo đơn & giữ hàng','Tạo đơn nháp, xác nhận; thử số lượng vượt tồn.'],['finance','04 · Thu tiền và xem lợi nhuận','Xuất kho, thu tiền tại chi tiết đơn rồi xem số liệu cập nhật.'],['playground','05 · Kiểm tra bot','Hỏi Essential; hỏi một chính sách chưa được duyệt.'],['review','06 · Ghi và xuất góp ý','Ghi phần thiếu rồi xuất file gửi lại trong cuộc trò chuyện.']].map(([p,t,d])=>`<button class="guide-choice" data-action="guide-go" data-page="${p}"><strong>${t}</strong><p>${d}</p></button>`).join('')}<p class="inline-note">Dữ liệu kinh doanh reset khi tải lại. Góp ý được lưu cục bộ nếu trình duyệt cho phép. Toàn bộ demo không có kết nối mạng.</p>`,btn('close-modal','Bắt đầu xem','','primary'));}

document.addEventListener('submit',e=>{const f=e.target;if(!f.id.startsWith('v2-'))return;e.preventDefault();e.stopImmediatePropagation();const data=new FormData(f),get=n=>String(data.get(n)||'').trim(),id=f.dataset.id;try{
 if(f.id==='v2-prep'){requireEdit('orders.fulfill');if(!data.has('confirmed'))throw new Error('Cần xác nhận đã kiểm hàng.');V2.advance(s(),id,f.dataset.target);}

 else if(f.id==='v2-notifications'){requireEdit('shop.manage');const n=Number(get('minutes'));if(!Number.isInteger(n)||n<1||n>60)throw new Error('Nhập 1–60 phút.');Object.assign(ops().policies,{reminderMinutes:n,quiet:get('quiet').slice(0,40),telegram:get('telegram')==='on'});}

function render(){BSDemo.v2.ensure(s());const meta=pageMeta[ui.page];let content;if(!meta)content=head('Không tìm thấy màn hình','Đường dẫn này không có trong bản demo.',link('overview','Về tổng quan','arrow','btn primary'));else if(!can(meta[1]))content=forbidden();else content=scenarioContent()||views[ui.page]();if(ui.scene==='offline')content=banner('Đang mô phỏng <b>mất mạng</b>. Bạn vẫn xem dữ liệu trong phiên, nhưng thao tác ghi bị chặn.','warn')+content;if(ui.scene==='stale')content=banner('Đang xem <b>dữ liệu cũ</b> trong kịch bản mẫu. Khôi phục trạng thái trước khi xác nhận kho, tiền hoặc gửi tin.','warn')+content;$('#root').innerHTML=shell(content);$('#root [data-action="mobile-menu"]').classList.add('mobile-menu');if(ui.page==='inbox'&&$('#chat-scroll'))$('#chat-scroll').scrollTop=$('#chat-scroll').scrollHeight;if(ui.page==='playground'&&$('#play-scroll'))$('#play-scroll').scrollTop=$('#play-scroll').scrollHeight;document.title=(meta?.[0]||'Demo')+' · BotSales AI · UI Review';}
function go(page){closeModal();if(ui.page===page){ui.query='';ui.filter='all';render();}else location.hash='/'+page;}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csv(rows){return '\uFEFF'+rows.map(row=>row.map(c=>{let v=String(c??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function exportReview(markdown=false){const obj={artifact:'BotSales AI UI Review',prototypeVersion:'1.1.1',basedOn:'Enterprise UI Kit 1.1',synthetic:true,exportedAt:new Date().toISOString(),checks:checklist.map(([id,title])=>({id,title,viewed:!!ui.checks[id]})),feedback:ui.feedback,notice:'Góp ý của người dùng; chưa phải yêu cầu đã được triển khai.'};if(markdown){const text='# Góp ý bản UI BotSales AI\n\nBản demo 1.1.1 · Đặc tả gốc 1.1\n\n## Danh sách đã xem\n'+obj.checks.map(c=>`- [${c.viewed?'x':' '}] ${c.title}`).join('\n')+'\n\n## Góp ý cần xử lý\n\n'+obj.feedback.map((f,i)=>`### ${i+1}. ${f.screen} — ${f.type}\n\nƯu tiên: ${f.priority}\nShop: ${f.shop}\n\n${f.text}\n`).join('\n');download('BotSalesAI_Gop_y_UI.md',text);}else download('BotSalesAI_Gop_y_UI.json',JSON.stringify(obj,null,2),'application/json');toast('Đã tạo file góp ý để tải. File chưa được gửi cho AI.');}
function exportData(type){if(type==='stock'){if(!can('inventory.read'))throw new Error('Thiếu quyền xem tồn.');download('BotSalesAI_Ton_kho_MAU.csv',csv([['SKU','San pham','Ton thuc te','Da giu','Kha dung'],...s().products.map(p=>[p.sku,p.name,p.onHand,p.reserved,D.available(p)])]),'text/csv;charset=utf-8');}else if(type==='orders'){if(!can('orders.read'))throw new Error('Thiếu quyền đơn hàng.');download('BotSalesAI_Don_hang_MAU.csv',csv([['Ma don','Khach mau','Tong VND','Trang thai','Thanh toan'],...s().orders.map(o=>[o.id,customer(o.customerId).name,D.total(o).toString(),o.state,o.payment])]),'text/csv;charset=utf-8');}else{if(!can('finance.read'))throw new Error('Thiếu quyền tài chính.');const t=D.tally(s());download(type==='cash'?'BotSalesAI_Dong_tien_MAU.csv':'BotSalesAI_Loi_nhuan_MAU.csv',csv(type==='cash'?[['Chi tieu','VND'],['Tien thu',t.receipts],['Tien chi',t.disbursements],['Bien dong tien thuan',t.cash]]:[['Chi tieu','VND'],['Doanh thu',t.revenue],['Gia von',t.cogs],['Chi phi van hanh',t.operating],['Loi nhuan quan tri',t.profit]]),'text/csv;charset=utf-8');}toast('Đã tạo CSV từ dữ liệu mẫu của shop hiện tại.');}

document.addEventListener('submit',e=>{
 const form=e.target;if(!form.id.startsWith('form-'))return;e.preventDefault();const f=new FormData(form),get=n=>String(f.get(n)||'').trim(),id=form.dataset.id;const error=form.querySelector('.form-error');if(error)error.textContent='';
 try{
 switch(form.id){
 case 'form-product':{requireEdit('catalog.write');const existing=s().products.find(p=>p.id===id);const data=Object.fromEntries(f);if(!can('finance.read'))data.cost=existing?.cost||'0';const p=D.addProduct(s(),data,existing?.id||nextId('p'));if(existing){Object.assign(existing,{...p,onHand:existing.onHand,reserved:existing.reserved,active:existing.active,threshold:existing.threshold,version:existing.version+1,icon:existing.icon});}else s().products.push(p);actionDone('Đã lưu sản phẩm',p.sku);break;}
 case 'form-category':{requireEdit('catalog.write');const name=get('name');if(!name)throw new Error('Nhập tên danh mục.');if(s().categories.some(c=>c.toLowerCase()===name.toLowerCase()))throw new Error('Danh mục đã tồn tại.');s().categories.push(name);actionDone('Đã thêm danh mục',name);break;}
 case 'form-stock':{requireEdit('inventory.adjust');const p=s().products.find(p=>p.id===get('productId'));const delta=Number(get('delta'));if(!p)throw new Error('Chọn sản phẩm hợp lệ.');if(!Number.isInteger(delta)||delta===0||Math.abs(delta)>10000)throw new Error('Mức điều chỉnh phải là số nguyên khác 0, không quá 10.000.');if(p.onHand+delta<p.reserved)throw new Error('Không thể giảm tồn xuống dưới '+p.reserved+' sản phẩm đang giữ.');if(get('reason').length<3)throw new Error('Vui lòng ghi rõ lý do.');p.onHand+=delta;p.version++;s().movements.unshift({id:nextId('MV-'),productId:p.id,change:delta,reason:get('reason'),date:'2026-09-29'});actionDone('Đã điều chỉnh tồn',p.sku+' '+(delta>0?'+':'')+delta);break;}
 case 'form-order':{requireEdit('orders.write');const ids=f.getAll('productId'),qty=f.getAll('quantity'),merged=new Map();if(!ids.length)throw new Error('Đơn cần ít nhất một sản phẩm.');for(let i=0;i<ids.length;i++)merged.set(ids[i],D.quantity(qty[i])+(merged.get(ids[i])||0));const lines=[...merged].map(([pid,n])=>{D.quantity(n);const p=s().products.find(p=>p.id===pid&&p.active);if(!p)throw new Error('Sản phẩm không hợp lệ.');return{productId:p.id,sku:p.sku,name:p.name,variant:p.variant,quantity:n,unitPrice:p.price,unitCost:p.cost};});if(!s().customers.some(c=>c.id===get('customerId')))throw new Error('Khách không thuộc shop hiện tại.');const o={id:nextId('DH-'),customerId:get('customerId'),date:'2026-09-29',lines,state:'draft',payment:'unpaid',fulfillment:'unfulfilled',note:get('note'),version:1};s().orders.push(o);auditAdd('Tạo đơn nháp',o.id);closeModal();render();orderDetail(o.id);toast('Đã tạo đơn nháp. Tồn kho chưa thay đổi.');break;}
 case 'form-reply':{requireEdit('conversations.reply');const c=s().conversations.find(c=>c.id===id);const text=get('text'),kind=get('kind');if(!c)throw new Error('Không tìm thấy hội thoại.');if(!text)throw new Error('Nhập nội dung trước khi gửi.');if(kind==='reply'){if(c.mode!=='human')throw new Error('Bấm Tiếp quản trước khi trả lời khách.');if(!c.eligible||!s().channel.connected)throw new Error('Gửi bị chặn: kịch bản không đủ điều kiện hoặc trang mẫu đã ngắt.');if(c.status!=='open')throw new Error('Mở lại hội thoại trước khi trả lời.');}c.messages.push({from:kind==='note'?'note':'agent',text,time:'Bây giờ (mẫu)'});auditAdd(kind==='note'?'Ghi chú nội bộ mẫu':'Gửi trả lời mẫu',c.id);render();toast(kind==='note'?'Đã thêm ghi chú nội bộ mẫu.':'Đã thêm tin trả lời vào demo. Không gửi Facebook.');break;}
 case 'form-customer':{requireEdit('customers.write');const name=get('name');if(!name)throw new Error('Tên khách không được trống.');const existing=s().customers.find(c=>c.id===id);const c={id:existing?.id||nextId('c'),name,phone:get('phone')||'Chưa cung cấp',tag:get('tag'),note:get('note')};if(existing)Object.assign(existing,c);else s().customers.push(c);actionDone('Đã lưu khách hàng mẫu',c.id);break;}
 case 'form-expense':{requireEdit('finance.post');if(D.money(get('amount'))===0n)throw new Error('Số tiền phải lớn hơn 0.');if(get('note').length<3)throw new Error('Cần diễn giải khoản chi.');const e={id:nextId('PC-'),type:get('type'),amount:get('amount'),note:get('note'),date:'2026-09-29'};s().expenses.push(e);actionDone('Đã ghi khoản chi mẫu',e.id);break;}
 case 'form-knowledge':{requireEdit('knowledge.write');if(!get('name')||!get('content'))throw new Error('Tên và nội dung không được trống.');const existing=s().knowledge.find(k=>k.id===id);const k={id:existing?.id||nextId('k'),name:get('name'),type:get('type'),content:get('content'),status:'draft',version:(existing?.version||0)+1};if(existing)Object.assign(existing,k);else s().knowledge.push(k);actionDone('Đã lưu bản nháp kiến thức',k.name);break;}
 case 'form-answer-feedback':{requireEdit('knowledge.write');if(get('text').length<5)throw new Error('Mô tả tối thiểu 5 ký tự.');s().reviews.push({id:nextId('kr'),title:'Cải thiện câu trả lời từ hội thoại',content:get('text'),status:'pending',source:'Hội thoại '+id+' (mẫu)'});actionDone('Đã ghi phản hồi cần duyệt',id);break;}
 case 'form-bot':requireEdit('bot.configure');D.money(get('maxBudget'));if(!get('instructions'))throw new Error('Chỉ dẫn không được trống.');Object.assign(s().bot,{tone:get('tone'),instructions:get('instructions'),maxBudget:get('maxBudget')});auditAdd('Lưu cấu hình bot','Chỉ có hiệu lực trong demo');render();toast('Đã lưu cấu hình mẫu. Không xuất bản ra dịch vụ thật.');break;
 case 'form-play':requireEdit('bot.configure');if(!get('question'))throw new Error('Nhập một câu hỏi.');ui.play.push({from:'customer',text:get('question')},{from:'bot',...mockReply(get('question'))});render();$('#play-input')?.focus();break;
 case 'form-import':{requireEdit('catalog.import');ui.importText=get('csv');const lines=ui.importText.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2||lines.length>101)throw new Error('Cần 1–100 dòng dữ liệu.');if(lines[0].trim()!=='sku,name,price,cost,category')throw new Error('Dòng đầu phải là: sku,name,price,cost,category');const seen=new Set();ui.importRows=lines.slice(1).map((line,i)=>{const cells=line.split(',').map(x=>x.trim());const [sku,name,price,cost,category]=cells;const r={sku,name,price,cost,category,error:null};try{if(cells.length!==5||line.includes('"'))throw new Error('Demo chỉ nhận đúng 5 cột, không có dấu nháy hoặc dấu phẩy trong ô.');D.addProduct(s(),r,'import-check-'+i);if(seen.has(sku.toUpperCase()))throw new Error('SKU lặp trong file.');seen.add(sku.toUpperCase());}catch(err){r.error=err.message;}return r;});render();break;}
 case 'form-channel':requireEdit('integrations.manage');if(!get('page'))throw new Error('Nhập tên trang mẫu.');s().channel.connected=true;s().channel.page=get('page');actionDone('Đã tạo kết nối giả lập','Không gọi Meta');break;
 case 'form-provider':{requireEdit('integrations.manage');if(!get('name')||!get('model'))throw new Error('Nhập tên và model mẫu.');const existing=s().providers.find(p=>p.id===id);const p={id:existing?.id||nextId('ai'),name:get('name'),adapter:get('adapter'),model:get('model'),enabled:true};if(existing)Object.assign(existing,p);else s().providers.push(p);actionDone('Đã lưu metadata kết nối mẫu',p.name);break;}
 case 'form-shop':requireEdit('shop.manage');if(!get('name'))throw new Error('Tên shop không được trống.');s().name=get('name');s().timezone=get('timezone');auditAdd('Sửa thông tin cửa hàng','Tên và múi giờ mẫu');render();toast('Đã lưu thông tin shop mẫu.');break;
 case 'form-team':{requireEdit('members.manage');if(!get('name'))throw new Error('Cần tên thành viên.');const existing=s().team.find(u=>u.id===id);const u={id:existing?.id||nextId('u'),name:get('name'),role:get('role')};if(existing)Object.assign(existing,u);else s().team.push(u);actionDone('Đã lưu thành viên mẫu',u.id);break;}
 case 'form-privacy':requireEdit('privacy.manage');{const n=Number(get('retention'));if(!Number.isInteger(n)||n<1||n>3650)throw new Error('Nhập 1–3650 ngày cho giá trị mẫu.');s().privacy.retention=String(n);}auditAdd('Sửa thời gian lưu mẫu','Không chạy job xóa thật');render();toast('Đã lưu số ngày mẫu. Không chạy tác vụ xóa nền.');break;
 case 'form-feedback':{if(get('text').length<5)throw new Error('Vui lòng mô tả ít nhất 5 ký tự.');ui.feedback.push({id:'FB-'+Date.now()+'-'+ui.feedback.length,screen:pageMeta[ui.page]?.[0]||ui.page,route:'#/'+ui.page,shop:s().name,role:roleNames[state.role],scene:ui.scene,type:get('type'),priority:get('priority'),text:get('text'),date:new Date().toLocaleString('vi-VN')});persistReview();closeModal();render();toast('Đã lưu góp ý trên máy. Chưa gửi cho AI.');break;}
 case 'form-options':{const role=get('role'),scene=get('scene');if(!permissions[role])throw new Error('Vai trò không hợp lệ.');state.role=role;ui.scene=scene;ui.play=[];ui.importRows=null;ui.importText='';ui.evalResults=null;closeModal();render();toast('Đã áp dụng vai trò và trạng thái UI mô phỏng.');break;}
 case 'form-login':state.role='owner';ui.scene='normal';go('workspaces');break;
 case 'form-onboarding':{if(!get('name'))throw new Error('Nhập tên shop mẫu.');const id=nextId('shop_demo_');const n=structuredClone(seed().shops.shop_demo_b);n.id=id;n.name=get('name');n.products=[];n.categories=['Chưa phân loại'];n.customers=[];n.knowledge=[];n.providers=[];n.team=[{id:'u1',name:'Jokertrader',role:'Chủ shop'}];n.audit=[];state.shops[id]=n;switchShop(id);toast('Đã tạo một shop trống trong phiên demo.');break;}
 default:throw new Error('Form này chưa được triển khai.');
 }
 }catch(err){if(error){error.textContent=err.message;error.scrollIntoView({block:'nearest'});}else toast(err.message,true);}
