name: frontend
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require real generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install on an authorized online machine and commit the generated lockfile.' && exit 1)
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - run: npm run setup
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
