name: frontend
on:
  push:
    paths:
      - BotSalesAI_Frontend/**
      - botsales-kit/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - BotSalesAI_Frontend/**
      - botsales-kit/**
      - .github/workflows/frontend.yml
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - name: Require real generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install on an authorized online machine and commit the generated lockfile.' && exit 1)
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - run: npm run setup
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Upload revision-scoped build and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            BotSalesAI_Frontend/apps/web/dist/
            BotSalesAI_Frontend/apps/web/dist-demo/
            BotSalesAI_Frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
