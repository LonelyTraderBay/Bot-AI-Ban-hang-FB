name: backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify backend (matrix and HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BotSalesAI_Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: BotSalesAI_Backend/.node-version
          cache: npm
          cache-dependency-path: BotSalesAI_Backend/package-lock.json
      - name: Pin npm to the backend lockfile toolchain
        run: npm install --global npm@11.17.0
      - name: Install from backend lockfile
        run: |
          before=$(sha256sum package-lock.json)
          npm ci
          test "$before" = "$(sha256sum package-lock.json)"
      - run: npm run verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: backend-matrix-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: BotSalesAI_Backend/test-results/backend/matrix.json
          if-no-files-found: error
