name: frontend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (source and build)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - name: Require real generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install on an authorized online machine and commit the generated lockfile.' && exit 1)
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - run: npm run setup
      - run: npm run verify

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard_id }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard_id: all
            shard_args: ''
            verify_built_demo: true
          - browser: firefox
            shard_id: 1-of-3
            shard_args: '--shard=1/3'
            verify_built_demo: true
          - browser: firefox
            shard_id: 2-of-3
            shard_args: '--shard=2/3'
            verify_built_demo: false
          - browser: firefox
            shard_id: 3-of-3
            shard_args: '--shard=3/3'
            verify_built_demo: false
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - name: Require real generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install on an authorized online machine and commit the generated lockfile.' && exit 1)
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run sharded browser E2E tests
        run: npm run test:e2e -- --project=${{ matrix.browser }} ${{ matrix.shard_args }} --reporter=line
      - name: Verify the built demo (${{ matrix.browser }})
        if: ${{ matrix.verify_built_demo }}
        run: npx playwright test --config playwright.built-demo.config.ts --output test-results/built-demo --project=${{ matrix.browser }}-built-demo --reporter=line
      - name: Upload revision-scoped build and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ matrix.browser }}-${{ matrix.shard_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            BotSalesAI_Frontend/apps/web/dist/
            BotSalesAI_Frontend/apps/web/dist-demo/
            BotSalesAI_Frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
