name: frontend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (source and build)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - name: Require real generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install on an authorized online machine and commit the generated lockfile.' && exit 1)
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
      - run: npm run setup
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          grep -q 'https://archive.ubuntu.com/ubuntu' /etc/apt/apt-mirrors.txt
      - name: Install Chromium required by browser-backed verification
        run: npx playwright install --with-deps chromium
      - run: npm run verify

  build-artifacts:
    name: build (browser artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/BotSalesAI_Frontend/evidence/**/*.png
            !/BotSalesAI_Frontend/evidence/**/*.jpeg
            !/BotSalesAI_Frontend/evidence/**/*.zip
            !/botsales-kit/execution/frontend-evidence/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run setup
      - name: Build the live artifact for browser regression
        run: npm run build
      - name: Build the demo once for this revision
        run: npm run build:demo
      - name: Upload the current revision build and demo worker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            BotSalesAI_Frontend/apps/web/dist/
            BotSalesAI_Frontend/apps/web/dist-demo/
            BotSalesAI_Frontend/apps/web/public/mockServiceWorker.js
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - browser: firefox
            install_browser: firefox
            shard_id: 1-of-9
            partition: '1/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 2-of-9
            partition: '2/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 3-of-9
            partition: '3/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 4-of-9
            partition: '4/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 5-of-9
            partition: '5/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 6-of-9
            partition: '6/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 7-of-9
            partition: '7/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 8-of-9
            partition: '8/9'
          - browser: firefox
            install_browser: firefox
            shard_id: 9-of-9
            partition: '9/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 1-of-9
            partition: '1/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 2-of-9
            partition: '2/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 3-of-9
            partition: '3/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 4-of-9
            partition: '4/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 5-of-9
            partition: '5/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 6-of-9
            partition: '6/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 7-of-9
            partition: '7/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 8-of-9
            partition: '8/9'
          - browser: chromium
            install_browser: chrome
            shard_id: 9-of-9
            partition: '9/9'
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    env:
      BOTSALES_E2E_WORKERS: '3'
      BOTSALES_E2E_RUNTIME: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/BotSalesAI_Frontend/evidence/**/*.png
            !/BotSalesAI_Frontend/evidence/**/*.jpeg
            !/BotSalesAI_Frontend/evidence/**/*.zip
            !/botsales-kit/execution/frontend-evidence/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - name: Require real generated lockfile
        run: test -f package-lock.json || (echo 'Run npm install on an authorized online machine and commit the generated lockfile.' && exit 1)
      - run: npm ci
      - name: Record and require browser runner capacity
        run: |
          node --input-type=module <<'NODE'
          import os from 'node:os';
          const requested = process.env.BOTSALES_E2E_WORKERS;
          const workers = Number(requested);
          const availableCpus = os.availableParallelism();
          console.log(JSON.stringify({ kind: 'browser-runner-capacity', availableCpus,
            totalMemoryBytes: os.totalmem(), workers }));
          if (!/^[1-4]$/.test(requested ?? '') || workers > availableCpus)
            throw new Error('Requested browser workers exceed the supported runner capacity.');
          NODE
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          grep -q 'https://archive.ubuntu.com/ubuntu' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps ${{ matrix.install_browser }}
      - name: Verify supported Google Chrome version
        if: ${{ matrix.browser == 'chromium' }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ channel: 'chrome' });
          const version = browser.version();
          await browser.close();
          const major = Number(version.match(/\d+/)?.[0] ?? NaN);
          console.log(`Google Chrome ${version}`);
          if (!Number.isInteger(major) || major < 154) {
            throw new Error(`Google Chrome ${version} is below the supported minimum 154`);
          }
          NODE
      - name: Require this attempt's successful build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../.github/scripts/wait-for-build.mjs
      - name: Download only this run's build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: BotSalesAI_Frontend/apps/web
      - name: Run sharded browser E2E tests
        run: node scripts/run-ci-e2e.mjs ${{ matrix.browser }} ${{ matrix.partition }}
      - name: Upload revision-scoped build and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ matrix.browser }}-${{ matrix.shard_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            BotSalesAI_Frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  built-demo:
    name: built demo (both engines)
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BotSalesAI_Frontend
    env:
      BOTSALES_BUILT_DEMO_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/BotSalesAI_Frontend/evidence/**/*.png
            !/BotSalesAI_Frontend/evidence/**/*.jpeg
            !/BotSalesAI_Frontend/evidence/**/*.zip
            !/botsales-kit/execution/frontend-evidence/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BotSalesAI_Frontend/package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Download only this run's build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: BotSalesAI_Frontend/apps/web
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          grep -q 'https://archive.ubuntu.com/ubuntu' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chrome firefox
      - name: Verify supported Google Chrome version
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ channel: 'chrome' });
          const version = browser.version();
          await browser.close();
          const major = Number(version.match(/\d+/)?.[0] ?? NaN);
          console.log(`Google Chrome ${version}`);
          if (!Number.isInteger(major) || major < 154) {
            throw new Error(`Google Chrome ${version} is below the supported minimum 154`);
          }
          NODE
      - name: Run both original serial built-demo suites
        run: node scripts/run-ci-built-demo.mjs
      - name: Upload both built-demo native reports and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-built-demo-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: BotSalesAI_Frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  chromium-gate:
    # Preserve the protected context while checking every browser matrix child.
    name: e2e (chromium all)
    needs: [verify, build-artifacts, e2e, built-demo]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require every source and browser shard to succeed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/require-success.mjs chromium

  success-gate:
    name: gate frontend (success only)
    needs: [verify, build-artifacts, e2e, built-demo, chromium-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require every source and browser job to complete successfully
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/require-success.mjs frontend
